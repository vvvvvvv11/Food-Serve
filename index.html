<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food & Serve — Премиум кейтеринг</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
    /* ----- БАЗОВЫЕ ПЕРЕМЕННЫЕ (премиум) ----- */
    :root {
        --accent: #f59e0b;
        --accent-dark: #d97706;
        --accent-light: #fde68a;
        --accent-glow: rgba(245, 158, 11, 0.25);
        --bg-primary: #ffffff;
        --bg-secondary: #fef9f0;
        --bg-tertiary: #fef3e8;
        --border: #ffe6d5;
        --text-primary: #2c241a;
        --text-secondary: #6b5a4e;
        --text-tertiary: #b9a99a;
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
        --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.06);
        --shadow-lg: 0 20px 30px -8px rgba(0, 0, 0, 0.1);
        --shadow-glow: 0 10px 25px -5px var(--accent-glow);
        --radius-md: 16px;
        --radius-lg: 28px;
        --transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        --glass-bg: rgba(255, 255, 255, 0.85);
        --glass-border: rgba(255, 255, 255, 0.6);
    }

    html[data-theme="dark"] {
        --accent: #fbbf24;
        --accent-dark: #f59e0b;
        --accent-light: #78350f;
        --accent-glow: rgba(251, 191, 36, 0.3);
        --bg-primary: #0c0a09;
        --bg-secondary: #1c1917;
        --bg-tertiary: #292524;
        --border: #3f3a36;
        --text-primary: #fef3c7;
        --text-secondary: #d6d3d1;
        --text-tertiary: #a8a29e;
        --glass-bg: rgba(28, 25, 23, 0.85);
        --glass-border: rgba(168, 162, 158, 0.2);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.5;
        transition: var(--transition);
        overflow-x: hidden;
    }

    /* ----- ИКОНКИ (псевдо‑svg) ----- */
    svg {
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .icon-24 svg { width: 24px; height: 24px; }
    .icon-20 svg { width: 20px; height: 20px; }
    .icon-18 svg { width: 18px; height: 18px; }

    /* ----- МОДАЛЬНОЕ ОКНО (премиум) ----- */
    .product-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(12px);
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        visibility: hidden;
        opacity: 0;
        transition: visibility 0.3s, opacity 0.3s;
    }

    .product-modal.active {
        visibility: visible;
        opacity: 1;
    }

    .modal-container {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-radius: 40px;
        max-width: 1000px;
        width: 90%;
        max-height: 90vh;
        overflow-y: auto;
        position: relative;
        animation: modalZoomIn 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.2);
        box-shadow: var(--shadow-lg);
    }

    @keyframes modalZoomIn {
        from {
            transform: scale(0.92);
            opacity: 0;
        }
        to {
            transform: scale(1);
            opacity: 1;
        }
    }

    .modal-close {
        position: absolute;
        top: 20px;
        right: 20px;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        width: 44px;
        height: 44px;
        border-radius: 99px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: var(--transition);
        z-index: 10;
        color: var(--text-primary);
    }

    .modal-close:hover {
        background: var(--accent);
        color: white;
        transform: scale(1.05) rotate(90deg);
        border-color: transparent;
    }

    .modal-content {
        display: flex;
        flex-direction: column;
        gap: 28px;
        padding: 32px;
    }

    @media (min-width: 768px) {
        .modal-content {
            flex-direction: row;
        }
    }

    .modal-image-section {
        flex: 1;
        position: relative;
        cursor: pointer;
        overflow: hidden;
        border-radius: 32px;
        background: var(--bg-tertiary);
        box-shadow: var(--shadow-md);
    }

    .modal-image {
        width: 100%;
        height: 300px;
        object-fit: cover;
        transition: transform 0.4s ease;
        border-radius: 32px;
    }

    .modal-image-section.zoomed .modal-image {
        transform: scale(1.5);
        cursor: zoom-out;
    }

    .zoom-hint {
        position: absolute;
        bottom: 16px;
        right: 16px;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(8px);
        color: white;
        padding: 6px 14px;
        border-radius: 60px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.3px;
    }

    .modal-info {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .modal-category {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--accent);
    }

    .modal-title {
        font-size: 32px;
        font-weight: 700;
        font-family: 'Syne', sans-serif;
        letter-spacing: -0.01em;
    }

    .modal-description {
        font-size: 15px;
        color: var(--text-secondary);
        line-height: 1.6;
    }

    .modal-price {
        font-size: 28px;
        font-weight: 700;
        color: var(--accent);
        margin: 8px 0 4px;
    }

    .modal-actions {
        display: flex;
        gap: 16px;
        margin-top: 12px;
        flex-wrap: wrap;
    }

    .modal-add-btn {
        padding: 12px 24px;
        background: linear-gradient(105deg, var(--accent) 0%, var(--accent-dark) 100%);
        color: white;
        border: none;
        border-radius: 60px;
        font-weight: 700;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 140px;
        font-size: 14px;
        box-shadow: var(--shadow-sm);
    }

    .modal-add-btn:hover {
        transform: scale(1.02);
        box-shadow: var(--shadow-glow);
        background: linear-gradient(105deg, var(--accent-dark) 0%, var(--accent) 100%);
    }

    .modal-fav-btn {
        padding: 12px 24px;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 60px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-primary);
        font-size: 14px;
    }

    .modal-fav-btn:hover {
        border-color: var(--accent);
        background: var(--accent-light);
        transform: translateY(-2px);
    }

    .modal-fav-btn.liked {
        background: #fef2f2;
        border-color: #dc2626;
        color: #dc2626;
    }

    /* ----- TOAST (премиум) ----- */
    .toast {
        position: fixed;
        bottom: 28px;
        right: 28px;
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        padding: 16px 24px;
        border-radius: 80px;
        box-shadow: var(--shadow-lg);
        z-index: 9999;
        animation: slideInRight 0.4s cubic-bezier(0.2, 0.9, 0.4, 1);
        display: flex;
        align-items: center;
        gap: 14px;
        font-weight: 500;
    }

    @keyframes slideInRight {
        from {
            transform: translateX(420px);
            opacity: 0;
        }
        to {
            transform: translateX(0);
            opacity: 1;
        }
    }

    @keyframes slideOutRight {
        from {
            transform: translateX(0);
            opacity: 1;
        }
        to {
            transform: translateX(420px);
            opacity: 0;
        }
    }

    /* ----- ПЛАВАЮЩАЯ КНОПКА КОРЗИНЫ ----- */
    .floating-cart-btn {
        position: fixed;
        bottom: 32px;
        right: 32px;
        width: 64px;
        height: 64px;
        background: linear-gradient(135deg, var(--accent), var(--accent-dark));
        border: none;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 998;
        box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.5);
        transition: var(--transition);
        opacity: 0;
        transform: translateY(100px) scale(0.9);
        pointer-events: none;
    }

    .floating-cart-btn.show {
        opacity: 1;
        transform: translateY(0) scale(1);
        pointer-events: auto;
    }

    .floating-cart-btn:hover {
        transform: scale(1.08);
        background: linear-gradient(135deg, var(--accent-dark), var(--accent));
        box-shadow: 0 18px 28px -8px rgba(245, 158, 11, 0.6);
    }
    /* Иконка внутри кнопки корзины */
.floating-cart-btn svg {
    width: 28px;
    height: 28px;
    stroke: white;
    stroke-width: 1.8;
    transition: transform 0.2s ease;
}

.floating-cart-btn:hover svg {
    transform: scale(1.05);
}

/* Бейдж с количеством товаров */
.floating-badge {
    position: absolute;
    top: -8px;
    right: -6px;
    background: linear-gradient(135deg, #dc2626, #ef4444);
    color: white;
    border-radius: 50%;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 800;
    border: 2px solid var(--bg-primary);
    box-shadow: 0 2px 8px rgba(220, 38, 38, 0.4);
    font-family: 'Inter', sans-serif;
}
/* Анимация для бейджа при добавлении товара */
@keyframes badgePop {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); background: #dc2626; }
    100% { transform: scale(1); }
}

.floating-badge-animate {
    animation: badgePop 0.3s ease-out;
}
    .floating-badge {
        position: absolute;
        top: -8px;
        right: -6px;
        background: #dc2626;
        color: white;
        border-radius: 50%;
        width: 26px;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 800;
        border: 2px solid var(--bg-primary);
        box-shadow: var(--shadow-sm);
    }

    /* ----- DROWER МЕНЮ (гамбургер) ----- */
    .drawer-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px);
        z-index: 399;
        opacity: 0;
        pointer-events: none;
        transition: var(--transition);
    }

    .drawer-overlay.active {
        opacity: 1;
        pointer-events: auto;
    }

    .drawer-menu {
        position: fixed;
        left: 0;
        top: 0;
        height: 100vh;
        width: 300px;
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        border-right: 1px solid var(--glass-border);
        z-index: 400;
        transform: translateX(-100%);
        transition: var(--transition);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
    }

    .drawer-menu.active {
        transform: translateX(0);
    }

    .drawer-header {
        padding: 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 700;
        font-size: 20px;
        font-family: 'Syne', sans-serif;
    }

    .drawer-close {
        background: none;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 99px;
        transition: var(--transition);
        color: var(--text-primary);
    }

    .drawer-close:hover {
        background: var(--accent-light);
        transform: rotate(90deg);
    }

    .drawer-item {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 20px;
        border-radius: 20px;
        cursor: pointer;
        transition: var(--transition);
        width: 100%;
        color: var(--text-primary);
        background: none;
        border: none;
        font-weight: 500;
        font-size: 16px;
    }

    .drawer-item:hover {
        background: var(--bg-tertiary);
        color: var(--accent);
        transform: translateX(6px);
    }

    /* ----- ХЕДЕР (стеклянный) ----- */
    header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--glass-border);
        padding: 14px 24px;
        transition: var(--transition);
    }

    .header-content {
        max-width: 1400px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 28px;
    }

    .logo {
        font-family: 'Syne', sans-serif;
        font-size: 24px;
        font-weight: 800;
        background: linear-gradient(125deg, var(--accent) 0%, var(--accent-dark) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 10px;
        letter-spacing: -0.3px;
    }

    .header-center {
        display: flex;
        gap: 36px;
        flex: 1;
        justify-content: center;
    }

    .nav {
        display: flex;
        gap: 36px;
    }

    .nav a {
        font-size: 15px;
        font-weight: 500;
        color: var(--text-secondary);
        text-decoration: none;
        transition: var(--transition);
        letter-spacing: -0.2px;
    }

    .nav a:hover {
        color: var(--accent);
        transform: translateY(-2px);
    }

    .header-actions {
        display: flex;
        gap: 14px;
        align-items: center;
    }

    .icon-btn {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        width: 48px;
        height: 48px;
        border-radius: 60px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: var(--transition);
        position: relative;
        color: var(--text-primary);
    }

    .icon-btn:hover {
        border-color: var(--accent);
        background: var(--accent-light);
        color: var(--accent);
        transform: translateY(-3px);
    }

    .cart-badge {
        position: absolute;
        top: -6px;
        right: -6px;
        background: var(--accent);
        color: white;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 800;
        border: 2px solid var(--bg-primary);
    }

    .menu-toggle {
        display: none;
    }

    .theme-toggle {
        overflow: hidden;
    }

    .theme-icon {
        position: absolute;
        transition: all 0.5s cubic-bezier(0.2, 0.8, 0.4, 1);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .sun-icon {
        opacity: 1;
        transform: rotate(0deg) scale(1);
    }

    .moon-icon {
        opacity: 0;
        transform: rotate(-180deg) scale(0);
    }

    html[data-theme="dark"] .sun-icon {
        opacity: 0;
        transform: rotate(180deg) scale(0);
    }

    html[data-theme="dark"] .moon-icon {
        opacity: 1;
        transform: rotate(0deg) scale(1);
    }

    /* ----- ОСНОВНОЙ КОНТЕНТ ----- */
    main {
        padding: 110px 24px 80px;
        background: var(--bg-primary);
    }

    .container {
        max-width: 1400px;
        margin: 0 auto;
    }

    h1 {
        font-family: 'Syne', sans-serif;
        font-size: 56px;
        font-weight: 800;
        margin-bottom: 16px;
        background: linear-gradient(125deg, var(--accent) 0%, var(--accent-dark) 80%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -1px;
    }

    .subtitle {
        font-size: 18px;
        color: var(--text-secondary);
        margin-bottom: 56px;
        font-weight: 400;
    }

    .search-section {
        margin-bottom: 48px;
    }

    .search-box {
        position: relative;
        max-width: 320px;
    }

    .search-input {
        width: 100%;
        padding: 14px 16px 14px 44px;
        border: 1.5px solid var(--border);
        border-radius: 60px;
        font-size: 14px;
        background: var(--bg-secondary);
        transition: var(--transition);
        color: var(--text-primary);
        backdrop-filter: blur(4px);
    }

    .search-input:focus {
        outline: none;
        border-color: var(--accent);
        background: var(--bg-primary);
        box-shadow: var(--shadow-glow);
    }

    .search-icon {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-tertiary);
        width: 18px;
        height: 18px;
    }

    /* ----- ИСТОРИЯ ПРОСМОТРОВ ----- */
    .history-section {
        margin-bottom: 56px;
        display: none;
    }

    .history-section.show {
        display: block;
    }

    .history-grid {
        display: flex;
        gap: 14px;
        overflow-x: auto;
        padding-bottom: 12px;
        margin-bottom: 28px;
    }

    .history-card {
        padding: 12px 20px;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 60px;
        white-space: nowrap;
        cursor: pointer;
        transition: var(--transition);
        font-size: 14px;
        font-weight: 500;
        flex-shrink: 0;
        color: var(--text-primary);
    }

    .history-card:hover {
        background: var(--accent-light);
        border-color: var(--accent);
        color: var(--accent);
        transform: translateY(-3px);
    }

    /* ----- ФИЛЬТРЫ КАТЕГОРИЙ ----- */
    .category-section {
        margin-bottom: 56px;
    }

    .category-filters {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
    }

    .filter-btn {
        padding: 12px 24px;
        border: 1.5px solid var(--border);
        background: var(--bg-secondary);
        color: var(--text-primary);
        border-radius: 60px;
        cursor: pointer;
        transition: var(--transition);
        font-weight: 600;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .filter-btn:hover {
        border-color: var(--accent);
        background: var(--accent-light);
        color: var(--accent);
        transform: translateY(-2px);
    }

    .filter-btn.active {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
        box-shadow: var(--shadow-glow);
    }

    /* ----- СЕТКА МЕНЮ (премиум карточки) ----- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 32px;
        margin-bottom: 64px;
    }

    .card {
        background: var(--bg-secondary);
        border-radius: 36px;
        overflow: hidden;
        transition: var(--transition);
        border: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        height: 100%;
        position: relative;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
    }

    .card:hover {
        transform: translateY(-12px);
        box-shadow: var(--shadow-lg);
        border-color: var(--accent);
    }

    .card-favorite {
        position: absolute;
        top: 18px;
        right: 18px;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(8px);
        border: none;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        z-index: 10;
        transition: var(--transition);
        box-shadow: var(--shadow-sm);
    }

    .card-favorite:hover {
        transform: scale(1.12);
        background: white;
    }

    .card-favorite.liked {
        color: #e11d48;
        background: #fff0f0;
    }

    .card-image {
        width: 100%;
        height: 240px;
        background: var(--bg-tertiary);
        overflow: hidden;
    }

    .card-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    .card:hover .card-image img {
        transform: scale(1.08);
    }

    .card-content {
        padding: 24px;
        display: flex;
        flex-direction: column;
        flex: 1;
    }

    .card-category {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--accent);
        margin-bottom: 12px;
    }

    .card-title {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 12px;
        color: var(--text-primary);
        font-family: 'Syne', sans-serif;
    }

    .card-desc {
        font-size: 14px;
        color: var(--text-secondary);
        margin-bottom: 20px;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;

// Конфетти
function showConfetti() {
    const colors = ['#f59e0b', '#d97706', '#fbbf24', '#fde68a', '#ff9f43'];
    for (let i = 0; i < 120; i++) {
        const confetti = document.createElement('div');
        confetti.style.cssText = `
            position: fixed;
            width: ${Math.random() * 8 + 4}px;
            height: ${Math.random() * 8 + 4}px;
            background: ${colors[Math.floor(Math.random() * colors.length)]};
            left: ${Math.random() * window.innerWidth}px;
            top: -20px;
            border-radius: ${Math.random() > 0.5 ? '50%' : '0%'};
            z-index: 10001;
            pointer-events: none;
            opacity: 0.9;
        `;
        document.body.appendChild(confetti);
        
        const duration = Math.random() * 2000 + 1500;
        const startTime = performance.now();
        const startLeft = parseFloat(confetti.style.left);
        const endLeft = startLeft + (Math.random() - 0.5) * 200;
        
        function animateConfetti(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            confetti.style.top = progress * (window.innerHeight + 50) + 'px';
            confetti.style.left = startLeft + (endLeft - startLeft) * progress + 'px';
            confetti.style.opacity = 1 - progress;
            if (progress < 1) requestAnimationFrame(animateConfetti);
            else confetti.remove();
        }
        requestAnimationFrame(animateConfetti);
    }
}

function getProductImage(product) {
    // Приоритет 1: Внешняя ссылка (image)
    if (product.image && product.image.startsWith('http')) {
        return product.image;
    }
    
    // Приоритет 2: Base64 изображение (image)
    if (product.image && product.image.startsWith('data:image')) {
        return product.image;
    }
    
    // Приоритет 3: Локальный файл из папки images (image)
    if (product.image && product.image.trim() !== '') {
        return product.image;
    }
    
    // Приоритет 4: Плейсхолдер
    return `https://placehold.co/400x300/f97316/white?text=${encodeURIComponent(product.title)}`;
}

function showSkeleton(count = 8) {
    const menuGrid = document.getElementById('menuGrid');
    menuGrid.innerHTML = Array.from({ length: count }, () => `
        <div class="skeleton-card">
            <div class="skeleton skeleton-img"></div>
            <div class="skeleton-body">
                <div class="skeleton skeleton-line short"></div>
                <div class="skeleton skeleton-line medium"></div>
                <div class="skeleton skeleton-line full"></div>

            </div>
        </div>
    `).join('');

async function loadProducts() {
    showSkeleton();
    loadCartFromStorage();
    try {
        const response = await fetch('products_rows.json');
        let jsonProducts = [];
        
        if (response.ok) {
            jsonProducts = await response.json();
        }
        
        // Объединяем товары из JSON и дефолтные
        products = [...jsonProducts, ...defaultProducts];
        
        // Удаляем дубликаты по title
        const uniqueProducts = new Map();
        products.forEach(product => {
            if (!uniqueProducts.has(product.title)) {
                uniqueProducts.set(product.title, product);
            }
        });
        products = Array.from(uniqueProducts.values());
        
        filteredProducts = [...products];
        renderCategoryFilters();
        renderMenu();
        renderViewHistory();
        
        if (jsonProducts.length === 0) {
            console.log('Используются дефолтные товары');
        }
    } catch (error) {
        console.error('Ошибка загрузки меню:', error);
        // Если JSON не загрузился, используем только дефолтные товары
        products = [...defaultProducts];
        filteredProducts = [...products];
        renderCategoryFilters();
        renderMenu();
        renderViewHistory();
        showToast('⚠️', 'Загружены демо-товары');
    }
}

        function renderCategoryFilters() {
            const filterContainer = document.getElementById('categoryFilters');
            const categories = [
                { name: 'Брускетты и канапе', icon: '🥖' },
                { name: 'Сэндвичи и блины', icon: '🥪' },
                { name: 'Холодные закуски', icon: '❄️' },
                { name: 'Салаты', icon: '🥗' },
                { name: 'Горячие блюда', icon: '🔥' },
                { name: 'Десерты', icon: '🍰' },
                { name: 'Гарниры', icon: '🍚' }
            ];
            filterContainer.innerHTML = `
                <button class="filter-btn active" data-category=""><span>✨</span> Все</button>
                ${categories.map(cat => `<button class="filter-btn" data-category="${cat.name}"><span>${cat.icon}</span> ${cat.name}</button>`).join('')}
            `;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => filterByCategory(btn.getAttribute('data-category')));
            });
            
            const drawerItems = document.getElementById('drawerItems');
            drawerItems.innerHTML = categories.map(cat => `<button class="drawer-item" data-category="${cat.name}"><span>${cat.icon}</span><span>${cat.name}</span></button>`).join('');
            drawerItems.querySelectorAll('.drawer-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    filterByCategory(btn.getAttribute('data-category'));
                    document.getElementById('drawerMenu').classList.remove('active');
                    document.getElementById('drawerOverlay').classList.remove('active');
                });
            });
        }

        function filterByCategory(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if ((category === '' && btn.getAttribute('data-category') === '') || btn.getAttribute('data-category') === category) {
                    btn.classList.add('active');
                }
            });
            filteredProducts = category === '' ? [...products] : products.filter(p => p.category === category);
            renderMenu();
        }

        function renderMenu() {
    const menuGrid = document.getElementById('menuGrid');

        menuGrid.innerHTML = '<div class="empty-state"><h2>😋 Нет блюд</h2><p>В этой категории пока нет блюд</p></div>';
        return;
    }
    
    menuGrid.innerHTML = filteredProducts.map((product, idx) => {
        const isFavorite = favorites.includes(product.title);
        const imageUrl = getProductImage(product);
        const currentQty = productQuantities[product.id] || 0;
        return `
            <div class="card fade-up" data-product-idx="${idx}" data-product-id="${product.id}">
                <div class="card-image">
                    <img src="${imageUrl}" alt="${escapeHtml(product.title)}" onerror="this.src='https://placehold.co/400x300/f97316/white?text=${encodeURIComponent(product.title)}'">

                <button class="card-favorite ${isFavorite ? 'liked' : ''}" data-fav-idx="${idx}">${isFavorite ? '❤️' : '🤍'}</button>

                    <div class="card-category">${escapeHtml(product.category)}</div>
                    <h3 class="card-title">${escapeHtml(product.title)}</h3>
                    <p class="card-desc">${escapeHtml(product.description)}</p>
                    <div class="card-footer">
                        <span class="price">${product.price} ₽</span>
                        ${currentQty > 0 ? `
                            <div class="quantity-control">
                                <button class="quantity-btn minus" data-id="${product.id}" data-delta="-1">−</button>
                                <span class="quantity-value" data-id="${product.id}">${currentQty}</span>
                                <button class="quantity-btn plus" data-id="${product.id}" data-delta="1">+</button>
                            </div>
                        ` : `
                            <button class="card-btn" data-add-idx="${idx}">
                                <svg viewBox="0 0 24 24" class="icon-18"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                                Добавить
                            </button>
                        `}
                    </div>
                </div>
            </div>
        `;
    }).join('');
    
    document.querySelectorAll('.card').forEach(card => {
        const idx = parseInt(card.getAttribute('data-product-idx'));
        card.addEventListener('click', (e) => {
            if (!e.target.closest('.card-favorite') && !e.target.closest('.card-btn') && !e.target.closest('.quantity-control')) {
                addToViewHistory(filteredProducts[idx].title);
                openProductModal(filteredProducts[idx]);
            }
        });
    });
    
    document.querySelectorAll('.card-favorite').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = parseInt(btn.getAttribute('data-fav-idx'));
            toggleFavorite(filteredProducts[idx].title);
        });
    });

    document.querySelectorAll('.card-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = parseInt(btn.getAttribute('data-add-idx'));
            const product = filteredProducts[idx];
            addToCartWithQuantity(product);
        });
    });
    
    // Обработчики для кнопок + и -
    document.querySelectorAll('.quantity-btn.minus').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const productId = parseInt(btn.getAttribute('data-id'));
            updateQuantity(productId, -1);
        });
    });
    
    document.querySelectorAll('.quantity-btn.plus').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const productId = parseInt(btn.getAttribute('data-id'));
            updateQuantity(productId, 1);
            showToast('➕', 'Количество увеличено');
        });
    });
    
    // Анимация появления при скролле
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) entry.target.classList.add('visible');
        });
    }, { threshold: 0.1 });
    document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
}

        function closeModal() {
            document.getElementById('productModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function escapeHtml(str) {
            if (!str) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;' };
            return str.replace(/[&<>]/g, m => map[m]);
        }

        function showToast(icon, message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<div class="toast-icon">${icon}</div><div class="toast-content"><p>${message}</p></div>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideOutRight 0.4s ease-out forwards';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        function toggleFavorite(productTitle) {
            const index = favorites.indexOf(productTitle);
            if (index > -1) {
                favorites.splice(index, 1);
                showToast('💔', 'Удалено из избранного');
            } else {
                favorites.push(productTitle);
                showToast('❤️', 'Добавлено в избранное');
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            renderMenu();
        }

        function addToViewHistory(productTitle) {
            viewHistory = viewHistory.filter(t => t !== productTitle);
            viewHistory.unshift(productTitle);
            if (viewHistory.length > 5) viewHistory.pop();
            localStorage.setItem('viewHistory', JSON.stringify(viewHistory));
            renderViewHistory();
        }

        function renderViewHistory() {
            const section = document.getElementById('historySection');
            const grid = document.getElementById('historyGrid');
            if (viewHistory.length === 0) {
                section.classList.remove('show');
                return;
            }
            section.classList.add('show');
            grid.innerHTML = viewHistory.map(title => `<div class="history-card" data-history="${escapeHtml(title)}">${escapeHtml(title)}</div>`).join('');
            document.querySelectorAll('.history-card').forEach(card => {
                card.addEventListener('click', () => {
                    document.getElementById('searchInput').value = card.getAttribute('data-history');
                    document.getElementById('searchInput').dispatchEvent(new Event('input'));
                });
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (!query) return filterByCategory(currentFilter);
            const source = currentFilter === '' ? products : products.filter(p => p.category === currentFilter);
            filteredProducts = source.filter(p => 
                p.title.toLowerCase().includes(query) || 
                p.description.toLowerCase().includes(query)
            );
            renderMenu();
        });

        function addToCartWithQuantity(product) {
    const newQty = (productQuantities[product.id] || 0) + 1;
    productQuantities[product.id] = newQty;
    
    // Обновляем отображение в карточке
    const qtySpan = document.querySelector(`.quantity-value[data-id="${product.id}"]`);
    if (qtySpan) qtySpan.textContent = newQty;
    
    // Пересобираем корзину из productQuantities
    const newCart = [];
    for (const [id, qty] of Object.entries(productQuantities)) {
        const p = products.find(pr => pr.id == id);
        if (p && qty > 0) {
            for (let i = 0; i < qty; i++) newCart.push({ ...p });
        }
    }
    cart = newCart;
    updateCart();
    renderMenu();
    // Pulse анимация кнопки корзины
    const cartBtn = document.getElementById('cartBtn');
    cartBtn.classList.add('cart-pulse');
    setTimeout(() => cartBtn.classList.remove('cart-pulse'), 300);
    
    showToast('✅', `${product.title} добавлен в корзину`);
}
    function updateQuantity(productId, delta) {
    const newQty = Math.max(0, (productQuantities[productId] || 0) + delta);
    if (newQty === 0) {
        delete productQuantities[productId];
    } else {
        productQuantities[productId] = newQty;
    }
    
    // Обновляем отображение в карточке
    const qtySpan = document.querySelector(`.quantity-value[data-id="${productId}"]`);
    if (qtySpan) qtySpan.textContent = productQuantities[productId] || 0;
    
    // Пересобираем корзину
    const newCart = [];
    for (const [id, qty] of Object.entries(productQuantities)) {
        const product = products.find(p => p.id == id);
        if (product && qty > 0) {
            for (let i = 0; i < qty; i++) newCart.push({ ...product });
        }
    }
    cart = newCart;
    updateCart();
    
}
        function removeFromCart(index) { cart.splice(index, 1); updateCart(); }
        
        function updateCart() {
    const oldCount = parseInt(document.getElementById('cartBadge').textContent);
    const newCount = cart.length;
    
    document.getElementById('cartBadge').textContent = newCount;
    document.getElementById('floatingBadge').textContent = newCount;
    
    // Анимация при изменении количества
    if (oldCount !== newCount && newCount > 0) {
        const badge = document.getElementById('cartBadge');
        const floatingBadge = document.getElementById('floatingBadge');
        badge.classList.add('cart-badge-animate');
        floatingBadge.classList.add('floating-badge-animate');
        setTimeout(() => {
            badge.classList.remove('cart-badge-animate');
            floatingBadge.classList.remove('floating-badge-animate');
        }, 300);
    }
    
    const cartIsOpen = document.getElementById('cartSidebar').classList.contains('active');
    document.getElementById('floatingCartBtn').classList.toggle('show', cart.length > 0 && !cartIsOpen);
    
    const itemsContainer = document.getElementById('cartItems');
    if (cart.length === 0) {
        itemsContainer.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-secondary);">🛒 Корзина пуста</div>';
    } else {
        itemsContainer.innerHTML = cart.map((item, i) => `
            <div class="cart-item">
                <div><h4 style="margin-bottom:4px;">${escapeHtml(item.title)}</h4><div class="cart-item-price">${item.price} ₽</div></div>
                <button onclick="window.removeFromCart(${i})" style="background:#fee2e2;color:#dc2626;border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;">✕</button>
            </div>
        `).join('');
    }
    document.getElementById('cartTotal').textContent = cart.reduce((s, i) => s + i.price, 0) + ' ₽';
    saveCartToStorage();
}
        window.removeFromCart = removeFromCart;

        document.getElementById('checkoutBtn').addEventListener('click', async () => {
            const name = document.getElementById('clientName').value.trim();

            const address = document.getElementById('clientAddress').value.trim();
            const comment = document.getElementById('clientComment').value.trim();
            if (!name || !phone || !address || cart.length === 0) {
                showToast('❌', 'Заполните все поля!');
                return;
            }

            const total = cart.reduce((s, i) => s + i.price, 0);
            const items = cart.map(i => `• ${i.title} — ${i.price} ₽`).join('\n');
            const now = new Date().toLocaleString('ru-RU', { timeZone: 'Europe/Moscow' });

            const message =
                `🛒 *Новый заказ!*\n` +
                `🕐 ${now}\n\n` +
                `👤 Имя: ${name}\n` +
                `📞 Телефон: ${phone}\n` +
                `📍 Адрес: ${address}\n` +
                (comment ? `💬 Комментарий: ${comment}\n` : '') +
                `\n📦 *Состав заказа:*\n${items}\n\n` +
                `💰 *Итого: ${total} ₽*`;

            const btn = document.getElementById('checkoutBtn');

            btn.textContent = 'Отправляем...';

            try {
                const res = await fetch('/api/order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name, phone, address, comment,
                        items: cart.map(i => ({ title: i.title, price: i.price })),
                        total
                    })
                });
                const data = await res.json();
                if (data.ok) {
                    showToast('✅', `Заказ оформлен! Скоро свяжемся с вами, ${name}`);
                    cart = [];
                    updateCart();

                    document.getElementById('cartSidebar').classList.remove('active');
                    document.getElementById('cartOverlay').classList.remove('active');
                } else {
                    showToast('❌', `Ошибка: ${data.error || 'попробуйте ещё раз'}`);
                    console.error('Order error:', data);
                }
            } catch (e) {
                showToast('❌', 'Нет соединения. Попробуйте ещё раз.');
                console.error(e);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Оформить заказ';

function initAddressAutocomplete() {
    const addressInput = document.getElementById('clientAddress');
    if (!addressInput) return;
    
    const API_TOKEN = "a1536f29148f16cd319c105cc9b6e9ec0c771517";
    let timeoutId = null;
    let dropdown = null;
    
    // Функция скрытия подсказок
    function hideSuggestions() {
        if (dropdown && dropdown.remove) {
            dropdown.remove();
            dropdown = null;
        }
    }
    
    // Функция показа подсказок
    function showSuggestions(suggestions) {
        hideSuggestions();
        
        if (!suggestions || suggestions.length === 0) return;
        
        dropdown = document.createElement('div');
        dropdown.className = 'address-suggestions';
        dropdown.style.cssText = `
            position: absolute;
            top: 100%;
            left: 0;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            z-index: 10000;
            max-height: 300px;
            overflow-y: auto;
            width: 100%;
            margin-top: 4px;
        `;
        
        dropdown.innerHTML = suggestions.map(suggestion => `
            <div class="address-suggestion-item" data-address="${suggestion.value.replace(/"/g, '&quot;')}" style="
                padding: 12px 16px;
                cursor: pointer;
                border-bottom: 1px solid var(--border);
                transition: all 0.2s ease;
                font-size: 14px;
                display: flex;
                align-items: center;
                gap: 10px;
            ">
                <span style="font-size: 16px;">📍</span>
                <span>${escapeHtml(suggestion.value)}</span>
            </div>
        `).join('');
        
        addressInput.parentNode.style.position = 'relative';
        addressInput.parentNode.appendChild(dropdown);
        
        // Обработчики для подсказок
        dropdown.querySelectorAll('.address-suggestion-item').forEach(item => {
            item.addEventListener('click', () => {
                addressInput.value = item.getAttribute('data-address');
                hideSuggestions();
            });
            
            item.addEventListener('mouseenter', () => {
                item.style.background = 'var(--accent-light)';
                item.style.color = 'var(--accent)';
            });
            
            item.addEventListener('mouseleave', () => {
                item.style.background = 'transparent';
                item.style.color = 'var(--text-primary)';
            });
        });
    }
    
    // Поиск адресов при вводе
    addressInput.addEventListener('input', function(e) {
        const query = e.target.value.trim();
        
        if (query.length < 3) {
            hideSuggestions();
            return;
        }
        
        // Дебаунс — ждём паузу в вводе
        if (timeoutId) clearTimeout(timeoutId);
        timeoutId = setTimeout(async () => {
            try {
                const response = await fetch('https://suggestions.dadata.ru/suggestions/api/4_1/rs/suggest/address', {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'Authorization': 'Token ' + API_TOKEN
                    },
                    body: JSON.stringify({ 
                        query: query,
                        count: 8,
                        from_bound: { value: "city" },
                        to_bound: { value: "house" }
                    })
                });
                
                const data = await response.json();
                showSuggestions(data.suggestions);
            } catch (error) {
                console.error('Ошибка при получении адресов:', error);
                hideSuggestions();
            }
        }, 300);
    });
    
    // Скрываем подсказки при клике вне поля
    document.addEventListener('click', function(e) {
        if (!addressInput.contains(e.target)) {
            hideSuggestions();
        }
    });
    
    // При фокусе на поле — ничего не делаем, ждём ввода
    addressInput.addEventListener('focus', () => {
        if (addressInput.value.length >= 3) {
            addressInput.dispatchEvent(new Event('input'));
        }
    });
}

// Запускаем при загрузке страницы
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAddressAutocomplete);
} else {
    initAddressAutocomplete();
}
    </script>
