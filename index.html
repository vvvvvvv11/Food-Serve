<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taste & Serve — Премиум кейтеринг</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4"></script>
    <style>
        :root {
            --accent: #f97316;
            --accent-dark: #ea580c;
            --accent-light: #fed7aa;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --border: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html[data-theme="dark"] {
            --accent: #ff9f43;
            --accent-dark: #ffa940;
            --accent-light: #ffe0b2;
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #262626;
            --border: #2a2a2a;
            --text-primary: #f5f5f5;
            --text-secondary: #b0b0b0;
            --text-tertiary: #808080;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: var(--transition);
            overflow-x: hidden;
        }

        svg { stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .icon-24 svg { width: 24px; height: 24px; }
        .icon-20 svg { width: 20px; height: 20px; }
        .icon-18 svg { width: 18px; height: 18px; }

        .product-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.3s, opacity 0.3s;
        }
        .product-modal.active { visibility: visible; opacity: 1; }
        .modal-container {
            background: var(--bg-primary);
            border-radius: 24px;
            max-width: 1000px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: modalZoomIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes modalZoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            z-index: 10;
            color: var(--text-primary);
        }
        .modal-close:hover { background: var(--accent); color: white; transform: scale(1.1); }
        .modal-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 30px;
        }
        @media (min-width: 768px) { .modal-content { flex-direction: row; } }
        .modal-image-section {
            flex: 1;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border-radius: 20px;
            background: var(--bg-secondary);
        }
        .modal-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            transition: transform 0.3s ease;
            border-radius: 20px;
        }
        .modal-image-section.zoomed .modal-image { transform: scale(1.5); cursor: zoom-out; }
        .zoom-hint {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 12px;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }
        .modal-info { flex: 1; display: flex; flex-direction: column; gap: 16px; }
        .modal-category { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--accent); letter-spacing: 1px; }
        .modal-title { font-size: 28px; font-weight: 700; font-family: 'Syne', sans-serif; }
        .modal-description { font-size: 15px; color: var(--text-secondary); line-height: 1.6; }
        
        /* ИСПРАВЛЕНО: уменьшенная цена в модалке */
        .modal-price { 
            font-size: 24px; 
            font-weight: 700; 
            color: var(--accent); 
            margin: 8px 0 4px; 
        }
        
        .modal-actions { display: flex; gap: 16px; margin-top: 16px; flex-wrap: wrap; }
        
        /* ИСПРАВЛЕНО: уменьшенная кнопка "В корзину" в модалке */
        .modal-add-btn {
            padding: 10px 20px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 120px;
            font-size: 14px;
        }
        .modal-add-btn:hover { background: var(--accent-dark); transform: scale(1.02); }
        
        /* ИСПРАВЛЕНО: уменьшенная кнопка "Избранное" в модалке */
        .modal-fav-btn {
            padding: 10px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-primary);
            font-size: 14px;
        }
        .modal-fav-btn:hover { border-color: var(--accent); background: var(--bg-tertiary); }
        .modal-fav-btn.liked { background: #fee2e2; border-color: #dc2626; color: #dc2626; }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-secondary);
            padding: 16px 24px;
            border-radius: var(--radius-lg);
            border-left: 4px solid var(--accent);
            box-shadow: var(--shadow-lg);
            z-index: 9999;
            animation: slideInRight 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        @keyframes slideInRight { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(400px); opacity: 0; } }
        .toast-icon { font-size: 20px; }
        .toast-content h4 { margin-bottom: 4px; font-size: 14px; }
        .toast-content p { font-size: 13px; color: var(--text-secondary); }

        .floating-cart-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: var(--accent);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 998;
            box-shadow: 0 8px 24px rgba(249, 115, 22, 0.4);
            transition: var(--transition);
            opacity: 0;
            transform: translateY(100px);
            pointer-events: none;
        }
        .floating-cart-btn.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .floating-cart-btn:hover { background: var(--accent-dark); transform: scale(1.15); }
        .floating-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #dc2626;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            border: 2px solid var(--bg-primary);
        }

        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 399;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }
        .drawer-overlay.active { opacity: 1; pointer-events: auto; }
        .drawer-menu {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: 280px;
            background: var(--bg-primary);
            border-right: 1px solid var(--border);
            z-index: 400;
            transform: translateX(-100%);
            transition: var(--transition);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .drawer-menu.active { transform: translateX(0); }
        .drawer-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
        }
        .drawer-close {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            color: var(--text-primary);
        }
        #drawerItems { flex: 1; overflow-y: auto; }
        .drawer-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            color: var(--text-primary);
            background: none;
            border: none;
        }
        .drawer-item:hover { background: var(--bg-secondary); color: var(--accent); }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            transition: var(--transition);
        }
        html[data-theme="dark"] header { background: rgba(15,15,15,0.95); }
        
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }
        .logo {
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-center { display: flex; gap: 32px; flex: 1; justify-content: center; }
        .nav { display: flex; gap: 32px; }
        .nav a { font-size: 14px; font-weight: 500; color: var(--text-secondary); text-decoration: none; transition: var(--transition); }
        .nav a:hover { color: var(--accent); }

        .header-actions { display: flex; gap: 12px; align-items: center; }
        .icon-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            position: relative;
            color: var(--text-primary);
        }
        .icon-btn:hover { border-color: var(--accent); background: var(--accent-light); color: var(--accent); transform: translateY(-2px); }
        .cart-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--accent);
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            border: 2px solid var(--bg-primary);
        }
        .menu-toggle { display: none; background: none; border: none; cursor: pointer; color: var(--text-primary); }
        .theme-toggle { overflow: hidden; }
        .theme-icon { position: absolute; transition: all 0.4s cubic-bezier(0.4,0,0.2,1); display: flex; align-items: center; justify-content: center; }
        .sun-icon { opacity: 1; transform: rotate(0deg) scale(1); }
        .moon-icon { opacity: 0; transform: rotate(-180deg) scale(0); }
        html[data-theme="dark"] .sun-icon { opacity: 0; transform: rotate(180deg) scale(0); }
        html[data-theme="dark"] .moon-icon { opacity: 1; transform: rotate(0deg) scale(1); }

        main { padding: 90px 20px 60px; background: var(--bg-primary); }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { font-size: 18px; color: var(--text-secondary); margin-bottom: 48px; }
        
        /* ИСПРАВЛЕНО: компактный поиск */
        .search-section { margin-bottom: 48px; }
        .search-box { position: relative; max-width: 300px; }
        .search-input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border: 2px solid var(--border);
            border-radius: var(--radius-lg);
            font-size: 13px;
            background: var(--bg-secondary);
            transition: var(--transition);
            color: var(--text-primary);
        }
        .search-input:focus { outline: none; border-color: var(--accent); background: var(--bg-primary); }
        .search-icon { 
            position: absolute; 
            left: 12px; 
            top: 50%; 
            transform: translateY(-50%); 
            color: var(--text-tertiary);
            width: 16px;
            height: 16px;
        }
        
        .history-section { margin-bottom: 48px; display: none; }
        .history-section.show { display: block; }
        .history-grid {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 32px;
        }
        .history-card {
            padding: 10px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            transition: var(--transition);
            font-size: 13px;
            flex-shrink: 0;
            color: var(--text-primary);
        }
        .history-card:hover {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }

        .category-section { margin-bottom: 48px; }
        .category-filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 10px 20px;
            border: 2px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .filter-btn:hover { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
        .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 48px;
        }
        .card {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: var(--transition);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            cursor: pointer;
        }
        .card:hover { transform: translateY(-12px); box-shadow: var(--shadow-lg); border-color: var(--accent); }
        .card-favorite {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255,255,255,0.9);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            z-index: 10;
            transition: var(--transition);
        }
        .card-favorite:hover { transform: scale(1.2); }
        .card-favorite.liked { color: #dc2626; }
        .card-image { width: 100%; height: 220px; background: var(--bg-tertiary); overflow: hidden; }
        .card-image img { width: 100%; height: 100%; object-fit: cover; transition: var(--transition); }
        .card:hover .card-image img { transform: scale(1.08); }
        .card-content { padding: 20px; display: flex; flex-direction: column; flex: 1; }
        .card-category { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
        .card-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: var(--text-primary); }
        .card-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; border-top: 1px solid var(--border); }
        .price { font-size: 18px; font-weight: 700; color: var(--accent); }
        .card-btn {
            padding: 10px 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }
        .card-btn:hover { background: var(--accent-dark); transform: scale(1.05); }

        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 499;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }
        .cart-overlay.active { opacity: 1; pointer-events: auto; }
        .cart-sidebar {
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            width: 400px;
            background: var(--bg-primary);
            border-left: 1px solid var(--border);
            z-index: 500;
            transform: translateX(100%);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 12px rgba(0, 0, 0, 0.1);
        }
        .cart-sidebar.active { transform: translateX(0); }
        .cart-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cart-title { font-size: 18px; font-weight: 700; color: var(--text-primary); }
        .cart-close {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
        }
        .cart-items { flex: 1; overflow-y: auto; padding: 20px; }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        .cart-item-price { font-size: 13px; color: var(--accent); font-weight: 600; margin-top: 4px; }
        .cart-form { padding: 20px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 13px; font-weight: 600; color: var(--text-primary); }
        .form-group input,
        .form-group textarea {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
        }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .cart-summary { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-top: 2px solid var(--border); font-weight: 700; }
        .summary-label { color: var(--text-secondary); }
        .summary-price { font-size: 18px; color: var(--accent); }
        
        /* ИСПРАВЛЕНО: уменьшенная кнопка оформления заказа */
        /* ИСПРАВЛЕНО: компактная кнопка оформления заказа */
/* МАЛЕНЬКАЯ КНОПКА ОФОРМЛЕНИЯ ЗАКАЗА */
.checkout-btn {
    margin: 0 auto 20px auto;
    padding: 8px 20px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 40px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: fit-content;
    min-width: 130px;
}
.checkout-btn:hover { background: var(--accent-dark); transform: scale(1.02); }

        .empty-state { padding: 60px 20px; text-align: center; grid-column: 1/-1; }
        .empty-state h2 { font-size: 24px; margin-bottom: 12px; }
        .empty-state p { color: var(--text-secondary); }

        footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 40px 20px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 60px;
        }
        footer p { margin-bottom: 8px; }
        footer strong { color: var(--text-primary); }

        @media (max-width: 1024px) {
            .header-center { display: none; }
            .nav { display: none; }
        }

        @media (max-width: 768px) {
            .logo { font-size: 18px; }
            .menu-toggle { display: flex; }
            .header-actions { gap: 8px; }
            .icon-btn { width: 44px; height: 44px; border-radius: 10px; }
            
            main { padding: 80px 16px 60px; }
            h1 { font-size: 32px; margin-bottom: 12px; }

    { id: 65, title: "Картофельное пюре со шпинатом", description: "Картофельное пюре, чеснок, шпинат. Вес:150г", price: 155, category: "Гарниры", image_url: "" },
    { id: 66, title: "Картофельное пюре с печёным чесноком", description: "Картофельное пюре, чеснок печёный. Вес:150г", price: 150, category: "Гарниры", image_url: "" },
    { id: 67, title: "Картофель по-деревенски с чесноком и розмарином", description: "Картофель, чеснок, тимьян, розмарин. Вес:120г", price: 140, category: "Гарниры", image_url: "" },
    { id: 68, title: "Гречка с лесными грибами и луком фри", description: "Крупа греча, шампиньоны, вешенки, белые грибы, лук репчатый, лук фри. Вес:150г", price: 170, category: "Гарниры", image_url: "" },
    { id: 69, title: "Кус-кус со сливочным маслом", description: "Кус-кус, масло сливочное. Вес:150г", price: 160, category: "Гарниры", image_url: "" },
    { id: 70, title: "Полента", description: "Полента, масло сливочное, сыр Чеддер. Вес:150г", price: 160, category: "Гарниры", image_url: "" },
    { id: 71, title: "Перлотто", description: "Крупа перловая, сливки, пармезан. Вес:150г", price: 155, category: "Гарниры", image_url: "" }

        const categories = [
            { name: 'Брускетты и канапе', icon: '🥖' },
            { name: 'Сэндвичи и блины', icon: '🥪' },
            { name: 'Холодные закуски', icon: '❄️' },
            { name: 'Салаты', icon: '🥗' },
            { name: 'Горячие блюда', icon: '🔥' },
            { name: 'Десерты', icon: '🍰' },
            { name: 'Гарниры', icon: '🍚' }
        ];

        let cart = [];
        let products = [];
        let filteredProducts = [];
        let currentFilter = '';
        let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
        let viewHistory = JSON.parse(localStorage.getItem('viewHistory')) || [];

        function getProductImage(product) {
            if (product.image_url && product.image_url.startsWith('http')) return product.image_url;
            if (product.image_file) return `${STORAGE_URL}/${product.image_file}`;
            return `https://placehold.co/400x300/f97316/white?text=${encodeURIComponent(product.title)}`;
        }

        async function loadImagesFromStorage() {
            for (const product of products) {
                const imageUrl = getProductImage(product);
                if (imageUrl && !imageUrl.includes('placehold')) {
                    try {
                        const response = await fetch(imageUrl, { method: 'HEAD' });
                        if (!response.ok) { product.image_url = null; product.image_file = null; }
                    } catch (error) { product.image_url = null; product.image_file = null; }
                }
            }
        }

        function loadProducts() {
            products = [...localProducts];
            filteredProducts = [...products];
            renderCategoryFilters();
            renderMenu();
            renderViewHistory();
            loadImagesFromStorage();
        }

        function renderCategoryFilters() {
            const filterContainer = document.getElementById('categoryFilters');
            filterContainer.innerHTML = `
                <button class="filter-btn active" data-category=""><span>✨</span> Все</button>
                ${categories.map(cat => `<button class="filter-btn" data-category="${cat.name}"><span>${cat.icon}</span> ${cat.name}</button>`).join('')}
            `;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => filterByCategory(btn.getAttribute('data-category')));
            });
            
            const drawerItems = document.getElementById('drawerItems');
            drawerItems.innerHTML = categories.map(cat => `<button class="drawer-item" data-category="${cat.name}"><span>${cat.icon}</span><span>${cat.name}</span></button>`).join('');
            drawerItems.querySelectorAll('.drawer-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    filterByCategory(btn.getAttribute('data-category'));
                    document.getElementById('drawerMenu').classList.remove('active');
                    document.getElementById('drawerOverlay').classList.remove('active');
                });
            });
        }

        function filterByCategory(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if ((category === '' && btn.getAttribute('data-category') === '') || btn.getAttribute('data-category') === category) {
                    btn.classList.add('active');
                }
            });
            filteredProducts = category === '' ? [...products] : products.filter(p => p.category === category);
            renderMenu();
        }

        function renderMenu() {
            const menuGrid = document.getElementById('menuGrid');
            if (filteredProducts.length === 0) {
                menuGrid.innerHTML = '<div class="empty-state"><h2>😋 Нет блюд</h2><p>В этой категории пока нет блюд</p></div>';
                return;
            }
            
            menuGrid.innerHTML = filteredProducts.map((product, idx) => {
                const isFavorite = favorites.includes(product.title);
                const imageUrl = getProductImage(product);
                return `
                    <div class="card" data-product-idx="${idx}">
                        <div class="card-image">
                            <img src="${imageUrl}" alt="${escapeHtml(product.title)}" onerror="this.src='https://placehold.co/400x300/f97316/white?text=${encodeURIComponent(product.title)}'">
                        </div>
                        <button class="card-favorite ${isFavorite ? 'liked' : ''}" data-fav-idx="${idx}">${isFavorite ? '❤️' : '🤍'}</button>
                        <div class="card-content">
                            <div class="card-category">${escapeHtml(product.category)}</div>
                            <h3 class="card-title">${escapeHtml(product.title)}</h3>
                            <p class="card-desc">${escapeHtml(product.description)}</p>
                            <div class="card-footer">
                                <span class="price">${product.price} ₽</span>
                                <button class="card-btn" data-add-idx="${idx}">
                                    <svg viewBox="0 0 24 24" class="icon-18"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                                    Добавить
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            document.querySelectorAll('.card').forEach(card => {
                const idx = parseInt(card.getAttribute('data-product-idx'));
                card.addEventListener('click', (e) => {
                    if (!e.target.closest('.card-favorite') && !e.target.closest('.card-btn')) {
                        addToViewHistory(filteredProducts[idx].title);
                        openProductModal(filteredProducts[idx]);
                    }
                });
            });
            
            document.querySelectorAll('.card-favorite').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(btn.getAttribute('data-fav-idx'));
                    toggleFavorite(filteredProducts[idx].title);
                });
            });

            document.querySelectorAll('.card-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(btn.getAttribute('data-add-idx'));
                    const product = filteredProducts[idx];
                    addToCart(product);
                    showToast('✅', `${product.title} добавлен в корзину`);
                });
            });
        }

        function openProductModal(product) {
            const imageUrl = getProductImage(product);
            const isFavorite = favorites.includes(product.title);
            
            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="modal-image-section" id="modalImageSection">
                    <img id="modalImage" class="modal-image" src="${imageUrl}" alt="${product.title}">
                    <div class="zoom-hint">Нажмите для увеличения</div>
                </div>
                <div class="modal-info">
                    <div class="modal-category">${product.category}</div>
                    <h2 class="modal-title">${escapeHtml(product.title)}</h2>
                    <p class="modal-description">${escapeHtml(product.description)}</p>
                    <div class="modal-price">${product.price} ₽</div>
                    <div class="modal-actions">
                        <button class="modal-add-btn" id="modalAddBtn">
                            <svg viewBox="0 0 24 24" class="icon-20"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                            В корзину
                        </button>
                        <button class="modal-fav-btn ${isFavorite ? 'liked' : ''}" id="modalFavBtn">
                            <svg viewBox="0 0 24 24" class="icon-20"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                            ${isFavorite ? 'В избранном' : 'Избранное'}
                        </button>
                    </div>
                </div>
            `;
            
            document.getElementById('productModal').classList.add('active');
            document.body.style.overflow = 'hidden';
            
            document.getElementById('modalAddBtn').onclick = () => {
                addToCart(product);
                showToast('✅', `${product.title} добавлен в корзину`);
                closeModal();
            };
            
            document.getElementById('modalImageSection').onclick = function() {
                this.classList.toggle('zoomed');
            };
            
            document.getElementById('modalFavBtn').onclick = () => {
                toggleFavorite(product.title);
                renderMenu();
                openProductModal(product);
            };
        }

        function closeModal() {
            document.getElementById('productModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function escapeHtml(str) {
            if (!str) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;' };
            return str.replace(/[&<>]/g, m => map[m]);
        }

        function showToast(icon, message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<div class="toast-icon">${icon}</div><div class="toast-content"><p>${message}</p></div>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideOutRight 0.4s ease-out forwards';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        function toggleFavorite(productTitle) {
            const index = favorites.indexOf(productTitle);
            if (index > -1) {
                favorites.splice(index, 1);
                showToast('💔', 'Удалено из избранного');
            } else {
                favorites.push(productTitle);
                showToast('❤️', 'Добавлено в избранное');
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            renderMenu();
        }

        function addToViewHistory(productTitle) {
            viewHistory = viewHistory.filter(t => t !== productTitle);
            viewHistory.unshift(productTitle);
            if (viewHistory.length > 5) viewHistory.pop();
            localStorage.setItem('viewHistory', JSON.stringify(viewHistory));
            renderViewHistory();
        }

        function renderViewHistory() {
            const section = document.getElementById('historySection');
            const grid = document.getElementById('historyGrid');
            if (viewHistory.length === 0) {
                section.classList.remove('show');
                return;
            }
            section.classList.add('show');
            grid.innerHTML = viewHistory.map(title => `<div class="history-card" data-history="${escapeHtml(title)}">${escapeHtml(title)}</div>`).join('');
            document.querySelectorAll('.history-card').forEach(card => {
                card.addEventListener('click', () => {
                    document.getElementById('searchInput').value = card.getAttribute('data-history');
                    document.getElementById('searchInput').dispatchEvent(new Event('input'));
                });
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (!query) return filterByCategory(currentFilter);
            const source = currentFilter === '' ? products : products.filter(p => p.category === currentFilter);
            filteredProducts = source.filter(p => 
                p.title.toLowerCase().includes(query) || 
                p.description.toLowerCase().includes(query)
            );
            renderMenu();
        });

        function addToCart(product) { cart.push({...product}); updateCart(); }
        function removeFromCart(index) { cart.splice(index, 1); updateCart(); }
        
        function updateCart() {
            document.getElementById('cartBadge').textContent = cart.length;
            document.getElementById('floatingBadge').textContent = cart.length;
            document.getElementById('floatingCartBtn').classList.toggle('show', cart.length > 0);
            
            const itemsContainer = document.getElementById('cartItems');
            if (cart.length === 0) {
                itemsContainer.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-secondary);">🛒 Корзина пуста</div>';
            } else {
                itemsContainer.innerHTML = cart.map((item, i) => `
                    <div class="cart-item">
                        <div><h4 style="margin-bottom:4px;">${escapeHtml(item.title)}</h4><div class="cart-item-price">${item.price} ₽</div></div>
                        <button onclick="window.removeFromCart(${i})" style="background:#fee2e2;color:#dc2626;border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;">✕</button>
                    </div>
                `).join('');
            }
            document.getElementById('cartTotal').textContent = cart.reduce((s, i) => s + i.price, 0) + ' ₽';
        }

        window.removeFromCart = removeFromCart;

        document.getElementById('checkoutBtn').addEventListener('click', async () => {
            const name = document.getElementById('clientName').value.trim();
            const phone = document.getElementById('clientPhone').value.trim();
            const address = document.getElementById('clientAddress').value.trim();
            if (!name || !phone || !address || cart.length === 0) {
                showToast('❌', 'Заполните все поля!');
                return;
            }
            const total = cart.reduce((s, i) => s + i.price, 0);
            alert(`✅ Заказ оформлен!\n\n${name}, ваш заказ на сумму ${total}₽ принят.\nСкоро с вами свяжутся по номеру ${phone}`);
            cart = [];
            updateCart();
            document.getElementById('clientName').value = '';
            document.getElementById('clientPhone').value = '';
            document.getElementById('clientAddress').value = '';
            document.getElementById('clientComment').value = '';
            document.getElementById('cartSidebar').classList.remove('active');
            document.getElementById('cartOverlay').classList.remove('active');
        });

        const html = document.documentElement;
        if (localStorage.getItem('theme') === 'dark') html.setAttribute('data-theme', 'dark');
        document.getElementById('themeToggle').addEventListener('click', () => {
            const newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });

        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('drawerMenu').classList.add('active');
            document.getElementById('drawerOverlay').classList.add('active');
        });
        document.getElementById('drawerClose').addEventListener('click', () => {
            document.getElementById('drawerMenu').classList.remove('active');
            document.getElementById('drawerOverlay').classList.remove('active');
        });
        document.getElementById('drawerOverlay').addEventListener('click', () => {
            document.getElementById('drawerMenu').classList.remove('active');
            document.getElementById('drawerOverlay').classList.remove('active');
        });

        document.getElementById('cartBtn').addEventListener('click', () => {
            document.getElementById('cartSidebar').classList.toggle('active');
            document.getElementById('cartOverlay').classList.toggle('active');
        });
        document.getElementById('cartClose').addEventListener('click', () => {
            document.getElementById('cartSidebar').classList.remove('active');
            document.getElementById('cartOverlay').classList.remove('active');
        });
        document.getElementById('cartOverlay').addEventListener('click', () => {
            document.getElementById('cartSidebar').classList.remove('active');
            document.getElementById('cartOverlay').classList.remove('active');
        });
        document.getElementById('floatingCartBtn').addEventListener('click', () => {
            document.getElementById('cartSidebar').classList.add('active');
            document.getElementById('cartOverlay').classList.add('active');
        });

        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('productModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('productModal')) closeModal();
        });

        loadProducts();
        updateCart();
    </script>
</body>
</html>
