<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ Панель — Taste & Serve</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4"></script>
    <style>
        :root {
            --accent: #f97316;
            --accent-dark: #ea580c;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --border: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .login-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .login-container.hidden {
            display: none;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            max-width: 400px;
            width: 90%;
        }

        .login-box h1 {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .login-box p {
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
        }

        .btn:hover {
            background: var(--accent-dark);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 12px;
            width: auto;
            border-radius: 6px;
        }

        .btn-danger {
            background: #fee2e2;
            color: #dc2626;
        }

        .btn-danger:hover {
            background: #fecaca;
        }

        .btn-success {
            background: #dcfce7;
            color: #15803d;
        }

        .btn-success:hover {
            background: #bbf7d0;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            background: white;
            padding: 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }

        .admin-header h1 {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 700;
        }

        .logout-btn {
            padding: 10px 20px;
            background: #fee2e2;
            color: #dc2626;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }

        .logout-btn:hover {
            background: #fecaca;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            margin-bottom: 30px;
        }

        .section h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .image-input-wrapper {
            position: relative;
            overflow: hidden;
        }

        .image-input-btn {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 2px dashed var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            color: var(--text-secondary);
            transition: var(--transition);
            text-align: center;
        }

        .image-input-btn:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
            color: var(--accent);
        }

        #fileInput, #editFileInput {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .image-preview {
            width: 150px;
            height: 150px;
            border-radius: var(--radius-md);
            object-fit: cover;
            margin-top: 12px;
            border: 1px solid var(--border);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 20px;
        }

        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: var(--radius-md);
            font-weight: 600;
            z-index: 999;
            opacity: 0;
            transition: var(--transition);
            pointer-events: none;
        }

        .message.show {
            opacity: 1;
            pointer-events: auto;
        }

        .message.success {
            background: #dcfce7;
            color: #15803d;
        }

        .message.error {
            background: #fee2e2;
            color: #dc2626;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--accent);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: var(--bg-tertiary);
        }

        .product-info {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .product-category {
            font-size: 12px;
            color: var(--accent);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .product-info h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .product-info p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .product-actions {
            display: flex;
            gap: 8px;
        }

        .product-actions button {
            flex: 1;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--bg-tertiary);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 500;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: var(--radius-lg);
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .admin-container {
                padding: 20px 16px;
            }
            .section {
                padding: 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div id="message" class="message"></div>

    <!-- LOGIN -->
    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <h1>🔐 Вход</h1>
            <p>Введите пароль админа для доступа</p>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="passwordInput" placeholder="••••••••">
            </div>
            <button class="btn" id="loginBtn">Войти</button>
        </div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="adminPanel" style="display: none;">
        <div class="admin-header">
            <h1>⚙️ Админ Панель</h1>
            <button class="logout-btn" id="logoutBtn">Выход</button>
        </div>

        <div class="admin-container">
            <!-- Add Product Section -->
            <div class="section">
                <h2>➕ Добавить блюдо</h2>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Название блюда *</label>
                        <input type="text" id="productTitle" placeholder="Сэндвич с тунцом">
                    </div>
                    <div class="form-group">
                        <label>Цена (₽) *</label>
                        <input type="number" id="productPrice" placeholder="350" min="0">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Категория *</label>
                        <select id="productCategory">
                            <option value="">-- Выберите категорию --</option>
                            <option value="Брускетты и канапе">Брускетты и канапе</option>
                            <option value="Сэндвичи и блины">Сэндвичи и блины</option>
                            <option value="Холодные закуски">Холодные закуски</option>
                            <option value="Салаты">Салаты</option>
                            <option value="Гарниры">Гарниры</option>
                            <option value="Горячие блюда">Горячие блюда</option>
                            <option value="Десерты">Десерты</option>
                        </select>
                    </div>
                </div>

                <div class="form-row full">
                    <div class="form-group">
                        <label>Описание *</label>
                        <textarea id="productDesc" placeholder="Хлеб тостовый, салат, томат, огурец, тунец..." rows="3"></textarea>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Фото блюда *</label>
                        <div class="image-input-wrapper">
                            <div class="image-input-btn">📷 Выбрать фото</div>
                            <input type="file" id="fileInput" accept="image/*">
                        </div>
                        <img id="previewImage" class="image-preview" style="display: none;">
                        <div id="uploadProgress" style="display: none; margin-top: 8px; font-size: 12px; color: var(--accent);"></div>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn" id="addProductBtn">Добавить блюдо</button>
                    <button class="btn btn-secondary" id="clearFormBtn">Очистить</button>
                </div>
            </div>

            <!-- Products List Section -->
            <div class="section">
                <h2>📋 Все блюда</h2>
                <div id="productsList" class="products-grid">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Загрузка блюд...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- EDIT MODAL -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeEditModal()">✕</button>
            <div class="modal-header">✏️ Редактировать блюдо</div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Название блюда *</label>
                    <input type="text" id="editTitle">
                </div>
                <div class="form-group">
                    <label>Цена (₽) *</label>
                    <input type="number" id="editPrice" min="0">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Категория *</label>
                    <select id="editCategory">
                        <option value="">-- Выберите категорию --</option>
                        <option value="Брускетты и канапе">Брускетты и канапе</option>
                        <option value="Сэндвичи и блины">Сэндвичи и блины</option>
                        <option value="Холодные закуски">Холодные закуски</option>
                        <option value="Салаты">Салаты</option>
                        <option value="Гарниры">Гарниры</option>
                        <option value="Горячие блюда">Горячие блюда</option>
                        <option value="Десерты">Десерты</option>
                    </select>
                </div>
            </div>

            <div class="form-row full">
                <div class="form-group">
                    <label>Описание *</label>
                    <textarea id="editDesc" rows="3"></textarea>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Фото (опционально)</label>
                    <div class="image-input-wrapper">
                        <div class="image-input-btn">📷 Выбрать новое фото</div>
                        <input type="file" id="editFileInput" accept="image/*">
                    </div>
                    <img id="editPreviewImage" class="image-preview">
                    <div id="editUploadProgress" style="display: none; margin-top: 8px; font-size: 12px; color: var(--accent);"></div>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-success" id="saveEditBtn">Сохранить</button>
                <button class="btn btn-secondary" onclick="closeEditModal()">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://temrphpbgqwodcvgagrz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlbXJwaHBiZ3F3b2RjdmdhZ3J6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0OTEyMDcsImV4cCI6MjA5NDA2NzIwN30.NoZmurpCp0owULMwEhEHwVdkX5ddSgYCkXATCkHBuJg';
        const ADMIN_PASSWORD = 'admin123'; // Измените на свой пароль!
        const STORAGE_BUCKET = 'products'; // Название bucket для хранения фото

        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let selectedFile = null;
        let editSelectedFile = null;
        let editingProductId = null;
        let products = [];

        // LOGIN
        const loginContainer = document.getElementById('loginContainer');
        const adminPanel = document.getElementById('adminPanel');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        if (localStorage.getItem('adminLoggedIn') === 'true') {
            loginContainer.classList.add('hidden');
            adminPanel.style.display = 'block';
            checkAndCreateBucket();
            loadProducts();
        }

        loginBtn.addEventListener('click', () => {
            if (passwordInput.value === ADMIN_PASSWORD) {
                localStorage.setItem('adminLoggedIn', 'true');
                loginContainer.classList.add('hidden');
                adminPanel.style.display = 'block';
                passwordInput.value = '';
                checkAndCreateBucket();
                loadProducts();
            } else {
                showMessage('❌ Неверный пароль!', 'error');
            }
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('adminLoggedIn');
            loginContainer.classList.remove('hidden');
            adminPanel.style.display = 'none';
        });

        // ПРОВЕРКА И СОЗДАНИЕ BUCKET
        async function checkAndCreateBucket() {
            try {
                // Проверяем, существует ли bucket
                const { data: buckets, error: listError } = await supabase.storage.listBuckets();
                
                if (listError) {
                    console.error('Ошибка получения списка buckets:', listError);
                    return;
                }
                
                const bucketExists = buckets?.some(b => b.name === STORAGE_BUCKET);
                
                if (!bucketExists) {
                    console.log('Создаю bucket:', STORAGE_BUCKET);
                    const { error: createError } = await supabase.storage.createBucket(STORAGE_BUCKET, {
                        public: true, // Делаем bucket публичным
                        fileSizeLimit: 5242880, // 5MB лимит
                        allowedMimeTypes: ['image/png', 'image/jpeg', 'image/jpg', 'image/webp']
                    });
                    
                    if (createError) {
                        console.error('Ошибка создания bucket:', createError);
                        showMessage('⚠️ Не удалось создать bucket, но вы можете создать его вручную в Supabase Dashboard', 'error');
                    } else {
                        console.log('✅ Bucket успешно создан');
                        showMessage('✅ Bucket для фото создан!', 'success');
                    }
                } else {
                    console.log('✅ Bucket уже существует');
                }
            } catch (error) {
                console.error('Ошибка:', error);
            }
        }

        // ЗАГРУЗКА ФАЙЛА В STORAGE
        async function uploadImageToStorage(file, productTitle) {
            if (!file) return null;
            
            // Создаем уникальное имя файла
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}-${productTitle.toLowerCase().replace(/[^a-z0-9]/g, '-')}.${fileExt}`;
            const filePath = `products/${fileName}`;
            
            console.log('Загрузка файла:', filePath);
            
            const { data, error } = await supabase.storage
                .from(STORAGE_BUCKET)
                .upload(filePath, file, {
                    cacheControl: '3600',
                    upsert: true
                });
            
            if (error) {
                console.error('Ошибка загрузки:', error);
                throw error;
            }
            
            // Получаем публичный URL
            const { data: publicUrlData } = supabase.storage
                .from(STORAGE_BUCKET)
                .getPublicUrl(filePath);
            
            console.log('Файл загружен, URL:', publicUrlData.publicUrl);
            return publicUrlData.publicUrl;
        }

        // УДАЛЕНИЕ ФАЙЛА ИЗ STORAGE
        async function deleteImageFromStorage(imageUrl) {
            if (!imageUrl) return;
            
            try {
                // Извлекаем путь из URL
                const urlParts = imageUrl.split('/');
                const filePath = urlParts.slice(urlParts.indexOf(STORAGE_BUCKET) + 1).join('/');
                
                if (filePath) {
                    const { error } = await supabase.storage
                        .from(STORAGE_BUCKET)
                        .remove([filePath]);
                    
                    if (error) {
                        console.error('Ошибка удаления файла:', error);
                    } else {
                        console.log('Файл удален:', filePath);
                    }
                }
            } catch (error) {
                console.error('Ошибка при удалении:', error);
            }
        }

        // ПОКАЗ СООБЩЕНИЙ
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.className = `message show ${type}`;
            messageEl.textContent = text;
            setTimeout(() => {
                messageEl.classList.remove('show');
            }, 3000);
        }

        // ЗАГРУЗКА ТОВАРОВ
        async function loadProducts() {
            try {
                const { data, error } = await supabase
                    .from('products')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                
                products = data || [];
                renderProducts();
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                showMessage('Ошибка загрузки блюд: ' + error.message, 'error');
            }
        }

        function renderProducts() {
            const listEl = document.getElementById('productsList');
            if (products.length === 0) {
                listEl.innerHTML = '<div class="loading"><p>📭 Нет добавленных блюд</p></div>';
                return;
            }

            listEl.innerHTML = products.map(product => `
                <div class="product-card">
                    <img src="${product.image_url || product.image || ''}" 
                         alt="${product.title}" 
                         class="product-image" 
                         onerror="this.src='https://placehold.co/400x300/f97316/white?text=${encodeURIComponent(product.title)}'">
                    <div class="product-info">
                        <div class="product-category">${product.category || 'Прочее'}</div>
                        <h3>${product.title}</h3>
                        <p>${product.description}</p>
                        <div class="product-price">${product.price} ₽</div>
                        <div class="product-actions">
                            <button class="btn btn-small btn-success" onclick="openEditModal(${product.id})">✏️ Редактировать</button>
                            <button class="btn btn-small btn-danger" onclick="deleteProduct(${product.id})">🗑️ Удалить</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ДОБАВЛЕНИЕ ТОВАРА
        const fileInput = document.getElementById('fileInput');
        const previewImage = document.getElementById('previewImage');
        const uploadProgress = document.getElementById('uploadProgress');

        fileInput.addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    previewImage.src = event.target.result;
                    previewImage.style.display = 'block';
                };
                reader.readAsDataURL(selectedFile);
            }
        });

        document.getElementById('clearFormBtn').addEventListener('click', () => {
            document.getElementById('productTitle').value = '';
            document.getElementById('productPrice').value = '';
            document.getElementById('productDesc').value = '';
            document.getElementById('productCategory').value = '';
            fileInput.value = '';
            previewImage.style.display = 'none';
            selectedFile = null;
            editingProductId = null;
        });

        document.getElementById('addProductBtn').addEventListener('click', async () => {
            const title = document.getElementById('productTitle').value.trim();
            const price = parseInt(document.getElementById('productPrice').value);
            const description = document.getElementById('productDesc').value.trim();
            const category = document.getElementById('productCategory').value;

            if (!title || !price || !description || !category || !selectedFile) {
                showMessage('❌ Заполните все поля и выберите фото!', 'error');
                return;
            }

            const addBtn = document.getElementById('addProductBtn');
            addBtn.disabled = true;
            addBtn.textContent = 'Загрузка...';
            uploadProgress.style.display = 'block';
            uploadProgress.textContent = '📤 Загрузка фото...';

            try {
                // Сначала загружаем фото в Storage
                const imageUrl = await uploadImageToStorage(selectedFile, title);
                
                if (!imageUrl) {
                    throw new Error('Не удалось загрузить фото');
                }
                
                uploadProgress.textContent = '💾 Сохранение в базу...';
                
                // Сохраняем товар в базу с URL фото
                const { data, error } = await supabase
                    .from('products')
                    .insert([{
                        title,
                        price,
                        description,
                        category,
                        image_url: imageUrl,
                        image: imageUrl
                    }])
                    .select();

                if (error) throw error;

                showMessage('✅ Блюдо успешно добавлено!', 'success');
                document.getElementById('clearFormBtn').click();
                await loadProducts();
            } catch (error) {
                console.error('Ошибка:', error);
                showMessage('❌ Ошибка добавления: ' + error.message, 'error');
            } finally {
                addBtn.disabled = false;
                addBtn.textContent = 'Добавить блюдо';
                uploadProgress.style.display = 'none';
            }
        });

        // УДАЛЕНИЕ ТОВАРА
        async function deleteProduct(id) {
            const product = products.find(p => p.id === id);
            if (!confirm(`Удалить "${product?.title}"? Это действие нельзя отменить!`)) return;

            try {
                // Удаляем фото из Storage
                if (product?.image_url) {
                    await deleteImageFromStorage(product.image_url);
                }
                
                // Удаляем товар из базы
                const { error } = await supabase
                    .from('products')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                showMessage('✅ Блюдо удалено!', 'success');
                await loadProducts();
            } catch (error) {
                console.error('Ошибка:', error);
                showMessage('❌ Ошибка удаления!', 'error');
            }
        }

        // РЕДАКТИРОВАНИЕ
        const editFileInput = document.getElementById('editFileInput');
        const editPreviewImage = document.getElementById('editPreviewImage');
        const editUploadProgress = document.getElementById('editUploadProgress');

        editFileInput.addEventListener('change', (e) => {
            editSelectedFile = e.target.files[0];
            if (editSelectedFile) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    editPreviewImage.src = event.target.result;
                    editPreviewImage.style.display = 'block';
                };
                reader.readAsDataURL(editSelectedFile);
            }
        });

        function openEditModal(productId) {
            editingProductId = productId;
            const product = products.find(p => p.id === productId);
            
            if (product) {
                document.getElementById('editTitle').value = product.title || '';
                document.getElementById('editPrice').value = product.price || '';
                document.getElementById('editDesc').value = product.description || '';
                document.getElementById('editCategory').value = product.category || '';
                editPreviewImage.src = product.image_url || product.image || '';
                editPreviewImage.style.display = 'block';
                editSelectedFile = null;
                editFileInput.value = '';
                
                document.getElementById('editModal').classList.add('active');
            }
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            editingProductId = null;
            editSelectedFile = null;
        }

        document.getElementById('saveEditBtn').addEventListener('click', async () => {
            if (!editingProductId) {
                showMessage('❌ Ошибка: товар не выбран', 'error');
                return;
            }

            const title = document.getElementById('editTitle').value.trim();
            const price = parseInt(document.getElementById('editPrice').value);
            const description = document.getElementById('editDesc').value.trim();
            const category = document.getElementById('editCategory').value;

            if (!title || !price || !description || !category) {
                showMessage('❌ Заполните все обязательные поля!', 'error');
                return;
            }

            const saveBtn = document.getElementById('saveEditBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'Сохранение...';
            
            if (editSelectedFile) {
                editUploadProgress.style.display = 'block';
                editUploadProgress.textContent = '📤 Загрузка нового фото...';
            }

            try {
                let imageUrl = null;
                const oldProduct = products.find(p => p.id === editingProductId);
                
                // Если выбрано новое фото - загружаем его
                if (editSelectedFile) {
                    // Удаляем старое фото
                    if (oldProduct?.image_url) {
                        await deleteImageFromStorage(oldProduct.image_url);
                    }
                    // Загружаем новое
                    imageUrl = await uploadImageToStorage(editSelectedFile, title);
                }
                
                const updateData = {
                    title,
                    price,
                    description,
                    category
                };
                
                if (imageUrl) {
                    updateData.image_url = imageUrl;
                    updateData.image = imageUrl;
                }
                
                const { error } = await supabase
                    .from('products')
                    .update(updateData)
                    .eq('id', editingProductId);

                if (error) throw error;

                showMessage('✅ Блюдо успешно обновлено!', 'success');
                closeEditModal();
                await loadProducts();
            } catch (error) {
                console.error('Ошибка:', error);
                showMessage('❌ Ошибка: ' + error.message, 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Сохранить';
                editUploadProgress.style.display = 'none';
            }
        });

        // Глобальные функции для onclick
        window.deleteProduct = deleteProduct;
        window.openEditModal = openEditModal;
        window.closeEditModal = closeEditModal;
    </script>
</body>
</html>
