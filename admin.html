<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ Панель — Taste & Serve</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4"></script>
    <style>
        :root {
            --accent: #f97316;
            --accent-dark: #ea580c;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --border: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .login-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .login-container.hidden {
            display: none;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            max-width: 400px;
            width: 90%;
        }

        .login-box h1 {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .login-box p {
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
        }

        .btn:hover {
            background: var(--accent-dark);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 12px;
            width: auto;
            border-radius: 6px;
        }

        .btn-danger {
            background: #fee2e2;
            color: #dc2626;
        }

        .btn-danger:hover {
            background: #fecaca;
        }

        .btn-success {
            background: #dcfce7;
            color: #15803d;
        }

        .btn-success:hover {
            background: #bbf7d0;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            background: white;
            padding: 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }

        .admin-header h1 {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .logout-btn {
            padding: 10px 20px;
            background: #fee2e2;
            color: #dc2626;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }

        .logout-btn:hover {
            background: #fecaca;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            margin-bottom: 30px;
        }

        .section h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .image-input-wrapper {
            position: relative;
            overflow: hidden;
        }

        .image-input-btn {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 2px dashed var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            color: var(--text-secondary);
            transition: var(--transition);
            text-align: center;
        }

        .image-input-btn:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
            color: var(--accent);
        }

        #fileInput {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .image-preview {
            width: 150px;
            height: 150px;
            border-radius: var(--radius-md);
            object-fit: cover;
            margin-top: 12px;
            border: 1px solid var(--border);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: var(--radius-md);
            font-weight: 600;
            z-index: 999;
            opacity: 0;
            transition: var(--transition);
            pointer-events: none;
        }

        .message.show {
            opacity: 1;
            pointer-events: auto;
        }

        .message.success {
            background: #dcfce7;
            color: #15803d;
        }

        .message.error {
            background: #fee2e2;
            color: #dc2626;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--accent);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: var(--bg-tertiary);
        }

        .product-info {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .product-category {
            font-size: 12px;
            color: var(--accent);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .product-info h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .product-info p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .product-actions {
            display: flex;
            gap: 8px;
        }

        .product-actions button {
            flex: 1;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--bg-tertiary);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 1024px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .admin-container {
                padding: 20px 16px;
            }

            .section {
                padding: 20px;
                margin-bottom: 20px;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 16px;
            }
        }

        @media (max-width: 768px) {
            .login-box {
                width: 95%;
                padding: 30px 20px;
            }

            .login-box h1 {
                font-size: 22px;
            }

            .admin-header {
                padding: 16px;
                margin-bottom: 20px;
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .admin-header h1 {
                font-size: 22px;
                margin-bottom: 0;
            }

            .logout-btn {
                width: 100%;
            }

            .admin-container {
                padding: 16px 12px;
                max-width: 100%;
            }

            .section {
                padding: 16px;
                margin-bottom: 16px;
            }

            .section h2 {
                font-size: 16px;
                margin-bottom: 16px;
            }

            .form-group label {
                font-size: 11px;
            }

            .form-group input,
            .form-group select,
            .form-group textarea {
                padding: 10px;
                font-size: 16px;
            }

            .form-row {
                gap: 12px;
                margin-bottom: 12px;
            }

            .image-preview {
                width: 120px;
                height: 120px;
                margin-top: 8px;
            }

            .btn-group {
                gap: 12px;
            }

            .btn {
                padding: 10px;
                font-size: 13px;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 12px;
            }

            .product-card {
                border-radius: 8px;
            }

            .product-image {
                height: 150px;
            }

            .product-info {
                padding: 12px;
            }

            .product-category {
                font-size: 10px;
                margin-bottom: 6px;
            }

            .product-info h3 {
                font-size: 13px;
                margin-bottom: 6px;
            }

            .product-info p {
                font-size: 11px;
                margin-bottom: 8px;
                -webkit-line-clamp: 1;
            }

            .product-price {
                font-size: 14px;
                margin-bottom: 8px;
            }

            .product-actions {
                gap: 6px;
            }

            .product-actions button {
                padding: 6px 8px;
                font-size: 10px;
            }

            .modal-content {
                padding: 20px;
                width: 95%;
            }

            .modal-header {
                font-size: 18px;
                margin-bottom: 16px;
            }
        }

        @media (max-width: 480px) {
            .login-box {
                width: 100%;
                padding: 24px 16px;
                border-radius: 12px;
            }

            .login-box h1 {
                font-size: 20px;
            }

            .login-box p {
                font-size: 13px;
            }

            .admin-header {
                padding: 12px;
                margin-bottom: 16px;
            }

            .admin-header h1 {
                font-size: 18px;
            }

            .logout-btn {
                padding: 8px 12px;
                font-size: 12px;
            }

            .admin-container {
                padding: 12px;
            }

            .section {
                padding: 12px;
                margin-bottom: 12px;
            }

            .section h2 {
                font-size: 14px;
                margin-bottom: 12px;
            }

            .form-group label {
                font-size: 10px;
                margin-bottom: 6px;
            }

            .form-group input,
            .form-group select,
            .form-group textarea {
                padding: 8px;
                font-size: 14px;
            }

            .form-row {
                gap: 8px;
                margin-bottom: 8px;
            }

            .form-row.full {
                grid-template-columns: 1fr;
            }

            .image-input-btn {
                padding: 10px;
                font-size: 12px;
            }

            .image-preview {
                width: 100px;
                height: 100px;
                margin-top: 6px;
            }

            .btn {
                padding: 8px;
                font-size: 12px;
            }

            .btn-small {
                padding: 6px 10px;
                font-size: 10px;
            }

            .btn-group {
                gap: 8px;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 8px;
            }

            .product-card {
                border-radius: 6px;
            }

            .product-image {
                height: 120px;
            }

            .product-info {
                padding: 8px;
            }

            .product-category {
                font-size: 9px;
                margin-bottom: 4px;
            }

            .product-info h3 {
                font-size: 11px;
                margin-bottom: 4px;
            }

            .product-info p {
                font-size: 9px;
                margin-bottom: 6px;
            }

            .product-price {
                font-size: 12px;
                margin-bottom: 6px;
            }

            .product-actions {
                gap: 4px;
                flex-direction: column;
            }

            .product-actions button {
                padding: 4px 6px;
                font-size: 9px;
            }

            .message {
                left: 10px;
                right: 10px;
                top: 10px;
                padding: 12px 16px;
                font-size: 12px;
                border-radius: 6px;
            }

            .modal {
                padding: 0 16px;
            }

            .modal-content {
                padding: 16px;
                width: 100%;
                max-height: 95vh;
            }

            .modal-header {
                font-size: 16px;
                margin-bottom: 12px;
            }

            .modal-close {
                top: 12px;
                right: 12px;
                font-size: 20px;
            }
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 500;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: var(--radius-lg);
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div id="message" class="message"></div>

    <!-- LOGIN -->
    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <h1>🔐 Вход</h1>
            <p>Введите пароль админа для доступа</p>
            <div class="form-group">

            <button class="logout-btn" id="logoutBtn">Выход</button>
        </div>

        <div class="admin-container">
            <!-- Add/Edit Product Section -->
            <div class="section">
                <h2>➕ Добавить/Изменить блюдо</h2>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Название блюда *</label>
                        <input type="text" id="productTitle" placeholder="Сэндвич с тунцом">
                    </div>
                    <div class="form-group">
                        <label>Цена (₽) *</label>
                        <input type="number" id="productPrice" placeholder="350" min="0">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Категория *</label>
                        <select id="productCategory">
                            <option value="">-- Выберите категорию --</option>
                            <option value="Брускетты и канапе">Брускетты и канапе</option>
                            <option value="Сэндвичи и блины">Сэндвичи и блины</option>
                            <option value="Холодные закуски">Холодные закуски</option>
                            <option value="Салаты">Салаты</option>
                            <option value="Гарниры">Гарниры</option>
                            <option value="Горячие блюда">Горячие блюда</option>

                    </div>
                </div>

                <div class="form-row full">
                    <div class="form-group">
                        <label>Описание *</label>
                        <textarea id="productDesc" placeholder="Хлеб тостовый, салат, томат, огурец, тунец..." rows="3" style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-family: 'Inter', sans-serif; color: var(--text-primary);"></textarea>

                </div>

                <div class="btn-group">
                    <button class="btn" id="addProductBtn">Добавить блюдо</button>
                    <button class="btn btn-secondary" id="clearFormBtn">Очистить</button>
                </div>
            </div>

            <!-- Products List Section -->
            <div class="section">
                <h2>📋 Все блюда</h2>
                <div id="productsList" class="products-grid">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Загрузка блюд...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- EDIT MODAL -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeEditModal()">✕</button>
            <div class="modal-header">Редактировать блюдо</div>

                <div class="form-group">
                    <label>Название блюда *</label>
                    <input type="text" id="editTitle" placeholder="Название">

            </div>

            <div class="form-row">

                        <option value="Сэндвичи и блины">Сэндвичи и блины</option>
                        <option value="Холодные закуски">Холодные закуски</option>
                        <option value="Салаты">Салаты</option>
                        <option value="Гарниры">Гарниры</option>
                        <option value="Горячие блюда">Горячие блюда</option>
                        <option value="Десерты">Десерты</option>
                    </select>
                </div>
            </div>

            <div class="form-row full">
                <div class="form-group">
                    <label>Описание *</label>
                    <textarea id="editDesc" placeholder="Описание..." rows="3" style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-family: 'Inter', sans-serif; color: var(--text-primary);"></textarea>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Фото (опционально)</label>
                    <div class="image-input-wrapper">
                        <div class="image-input-btn">📷 Выбрать новое фото</div>
                        <input type="file" id="editFileInput" accept="image/*">
                    </div>
                    <img id="editPreviewImage" class="image-preview">
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-success" id="saveEditBtn">Сохранить</button>
                <button class="btn btn-secondary" onclick="closeEditModal()">Отмена</button>
            </div>
        </div>
    </div>

        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        if (localStorage.getItem('adminLoggedIn') === 'true') {
            loginContainer.classList.add('hidden');
            adminPanel.style.display = 'block';
            loadProducts();
        }

        loginBtn.addEventListener('click', () => {
            if (passwordInput.value === ADMIN_PASSWORD) {
                localStorage.setItem('adminLoggedIn', 'true');
                loginContainer.classList.add('hidden');
                adminPanel.style.display = 'block';
                passwordInput.value = '';
                loadProducts();
            } else {
                alert('❌ Неверный пароль!');
            }
        });

        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('adminLoggedIn');
            loginContainer.classList.remove('hidden');
            adminPanel.style.display = 'none';
            passwordInput.value = '';
        });

        // IMAGE UPLOAD
        const fileInput = document.getElementById('fileInput');
        const previewImage = document.getElementById('previewImage');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    selectedImageBase64 = event.target.result;
                    previewImage.src = selectedImageBase64;
                    previewImage.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // EDIT IMAGE UPLOAD
        const editFileInput = document.getElementById('editFileInput');
        const editPreviewImage = document.getElementById('editPreviewImage');
        let editImageBase64 = null;

        editFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    editImageBase64 = event.target.result;
                    editPreviewImage.src = editImageBase64;
                    editPreviewImage.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // MESSAGE DISPLAY
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.className = `message show ${type}`;
            messageEl.textContent = text;
            setTimeout(() => {
                messageEl.classList.remove('show');
            }, 3000);
        }

        // LOAD PRODUCTS
        async function loadProducts() {
            try {
                const { data, error } = await supabase
                    .from('products')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                products = data || [];
                renderProducts();
            } catch (error) {
                console.error('Ошибка:', error);
                showMessage('Ошибка загрузки блюд', 'error');
            }
        }

        function renderProducts() {
            const listEl = document.getElementById('productsList');
            if (products.length === 0) {
                listEl.innerHTML = '<div class="loading"><p>Нет добавленных блюд</p></div>';
                return;
            }

            listEl.innerHTML = products.map(product => `
                <div class="product-card">
                    <img src="${product.image}" alt="${product.title}" class="product-image" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22%3E%3Crect fill=%22%23F1F5F9%22 width=%22200%22 height=%22200%22/%3E%3C/svg%3E'">
                    <div class="product-info">
                        <div class="product-category">${product.category || 'Прочее'}</div>
                        <h3>${product.title}</h3>
                        <p>${product.description}</p>
                        <div class="product-price">${product.price} ₽</div>
                        <div class="product-actions">
                            <button class="btn btn-small btn-success" onclick="openEditModal(${product.id})">✏️ Редактировать</button>
                            <button class="btn btn-small btn-danger" onclick="deleteProduct(${product.id})">🗑️ Удалить</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ADD PRODUCT
        const addProductBtn = document.getElementById('addProductBtn');
        const clearFormBtn = document.getElementById('clearFormBtn');

        clearFormBtn.addEventListener('click', () => {
            document.getElementById('productTitle').value = '';
            document.getElementById('productPrice').value = '';
            document.getElementById('productDesc').value = '';
            document.getElementById('productCategory').value = '';
            fileInput.value = '';
            previewImage.style.display = 'none';
            selectedImageBase64 = null;
            editingProductId = null;
        });

        addProductBtn.addEventListener('click', async () => {
            const title = document.getElementById('productTitle').value.trim();
            const price = parseInt(document.getElementById('productPrice').value);
            const description = document.getElementById('productDesc').value.trim();
            const category = document.getElementById('productCategory').value.trim();

            if (!title || !price || !description || !category || !selectedImageBase64) {
                showMessage('❌ Заполните все поля и выберите фото!', 'error');
                return;
            }

            addProductBtn.disabled = true;
            addProductBtn.textContent = 'Загрузка...';

            try {
                const { data, error } = await supabase
                    .from('products')
                    .insert([{
                        title,
                        price,
                        description,
                        category,
                        image: selectedImageBase64
                    }])
                    .select();

                if (error) throw error;

                showMessage('✅ Блюдо успешно добавлено!', 'success');
                clearFormBtn.click();
                await loadProducts();
            } catch (error) {
                console.error('Ошибка:', error);
                showMessage('❌ Ошибка добавления: ' + error.message, 'error');
            } finally {
                addProductBtn.disabled = false;
                addProductBtn.textContent = 'Добавить блюдо';
            }
        });

        // DELETE PRODUCT
        async function deleteProduct(id) {
            if (!confirm('Вы уверены? Это действие нельзя отменить!')) return;

            try {
                const { error } = await supabase
                    .from('products')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                showMessage('✅ Блюдо удалено!', 'success');
                await loadProducts();
            } catch (error) {
                console.error('Ошибка:', error);
                showMessage('❌ Ошибка удаления!', 'error');
            }
        }

        // EDIT MODAL FUNCTIONS
        function openEditModal(productId) {
            editingProductId = productId;
            const product = products.find(p => p.id === productId);
            
            if (product) {
                document.getElementById('editTitle').value = product.title || '';
                document.getElementById('editPrice').value = product.price || '';
                document.getElementById('editDesc').value = product.description || '';
                document.getElementById('editCategory').value = product.category || '';
                editPreviewImage.src = product.image || '';
                editPreviewImage.style.display = 'block';
                editImageBase64 = null;
                editFileInput.value = '';
                
                document.getElementById('editModal').classList.add('active');
                console.log('Открыто редактирование товара:', productId);
            }
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            editingProductId = null;
            editImageBase64 = null;
        }

        // SAVE EDIT
        document.getElementById('saveEditBtn').addEventListener('click', async () => {
            console.log('Попытка сохранить товар ID:', editingProductId);
            
            if (!editingProductId) {
                console.error('editingProductId не установлен');
                showMessage('❌ Ошибка: товар не выбран', 'error');
                return;
            }

            const title = document.getElementById('editTitle').value.trim();
            const priceStr = document.getElementById('editPrice').value;
            const description = document.getElementById('editDesc').value.trim();
            const category = document.getElementById('editCategory').value.trim();

            console.log('Данные для сохранения:', { title, price: priceStr, description, category });

            if (!title || !priceStr || !description || !category) {
                showMessage('❌ Заполните все обязательные поля!', 'error');
                return;
            }

            const price = parseInt(priceStr);
            if (isNaN(price)) {
                showMessage('❌ Цена должна быть числом!', 'error');
                return;
            }

            const saveBtn = document.getElementById('saveEditBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'Сохранение...';

            try {
                const updateData = {
                    title: title,
                    price: price,
                    description: description,
                    category: category
                };

                // Добавляем изображение если оно выбрано
                if (editImageBase64) {
                    updateData.image = editImageBase64;
                }

                console.log('Отправляю на Supabase:', updateData);

                const { data, error } = await supabase
                    .from('products')
                    .update(updateData)
                    .eq('id', editingProductId)
                    .select();

                if (error) {
                    console.error('Ошибка Supabase:', error);
                    throw error;
                }

                console.log('Товар успешно обновлен:', data);
                showMessage('✅ Блюдо успешно обновлено!', 'success');
                closeEditModal();
                await loadProducts();
            } catch (error) {
                console.error('Ошибка при сохранении:', error);
                showMessage('❌ Ошибка: ' + (error.message || 'Неизвестная ошибка'), 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Сохранить';
            }
        });

        window.deleteProduct = deleteProduct;
        window.openEditModal = openEditModal;
        window.closeEditModal = closeEditModal;
    </script>
</body>
</html>
