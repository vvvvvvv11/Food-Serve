<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ Панель — Taste & Serve</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4"></script>
    <style>
        :root {
            --accent: #f97316;
            --accent-dark: #ea580c;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --border: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .login-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .login-container.hidden {
            display: none;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            max-width: 400px;
            width: 90%;
        }

        .login-box h1 {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .login-box p {
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
        }

        .btn:hover {
            background: var(--accent-dark);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 12px;
            width: auto;
            border-radius: 6px;
        }

        .btn-danger {
            background: #fee2e2;
            color: #dc2626;
        }

        .btn-danger:hover {
            background: #fecaca;
        }

        .btn-success {
            background: #dcfce7;
            color: #15803d;
        }

        .btn-success:hover {
            background: #bbf7d0;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            background: white;
            padding: 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }

        .admin-header h1 {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .logout-btn {
            padding: 10px 20px;
            background: #fee2e2;
            color: #dc2626;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }

        .logout-btn:hover {
            background: #fecaca;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            margin-bottom: 30px;
        }

        .section h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .image-input-wrapper {
            position: relative;
            overflow: hidden;
        }

        .image-input-btn {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 2px dashed var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            color: var(--text-secondary);
            transition: var(--transition);
            text-align: center;
        }

        .image-input-btn:hover {
            background: var(--border);
            border-color: var(--accent);
        }

        .image-input-wrapper input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .image-preview {
            max-width: 200px;
            max-height: 200px;
            margin-top: 12px;
            border-radius: var(--radius-md);
            display: none;
        }

        .product-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
        }

        .product-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px);
        }

        .product-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .product-info {
            padding: 16px;
        }

        .product-category {
            font-size: 12px;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .product-card h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .product-card p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .product-actions {
            display: flex;
            gap: 8px;
        }

        .product-actions .btn {
            flex: 1;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-group .btn {
            flex: 1;
        }

        .message {
            padding: 16px;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .message.error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: var(--radius-lg);
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .loading p {
            margin-bottom: 16px;
        }

        .spinner {
            border: 4px solid var(--bg-tertiary);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .admin-header {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }

            .product-list {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <h1>🔐 Админ Панель</h1>
            <p>Введите email и пароль</p>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="emailInput" placeholder="your@email.com" />
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="passwordInput" placeholder="••••••••" />
            </div>
            <button class="btn" id="loginBtn">Войти</button>
        </div>
    </div>

    <div id="adminPanel" style="display: none;">
        <div class="admin-container">
            <div class="admin-header">
                <h1>📊 Управление меню</h1>
                <button class="logout-btn" id="logoutBtn">Выход</button>
            </div>

            <div id="messageContainer"></div>

            <!-- ДОБАВЛЕНИЕ ТОВАРА -->
            <div class="section">
                <h2>➕ Добавить новое блюдо</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label>Название блюда *</label>
                        <input type="text" id="productTitle" placeholder="Название блюда...">
                    </div>
                    <div class="form-group">
                        <label>Цена (₽) *</label>
                        <input type="number" id="productPrice" placeholder="0" min="0">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Категория *</label>
                        <select id="productCategory">
                            <option value="">Выберите категорию</option>
                            <option value="Закуски">Закуски</option>
                            <option value="Супы">Супы</option>
                            <option value="Салаты">Салаты</option>
                            <option value="Гарниры">Гарниры</option>
                            <option value="Горячие блюда">Горячие блюда</option>
                            <option value="Десерты">Десерты</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Фото *</label>
                        <div class="image-input-wrapper">
                            <div class="image-input-btn">📷 Выбрать фото</div>
                            <input type="file" id="fileInput" accept="image/*">
                        </div>
                        <img id="previewImage" class="image-preview">
                    </div>
                </div>

                <div class="form-row full">
                    <div class="form-group">
                        <label>Описание *</label>
                        <textarea id="productDesc" placeholder="Описание блюда..." rows="3" style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-family: 'Inter', sans-serif; color: var(--text-primary);"></textarea>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn" id="addProductBtn">✅ Добавить блюдо</button>
                    <button class="btn btn-secondary" id="clearFormBtn">Очистить</button>
                </div>
            </div>

            <!-- СПИСОК ТОВАРОВ -->
            <div class="section">
                <h2>📋 Список блюд</h2>
                <div id="productList" class="product-list"></div>
            </div>
        </div>
    </div>

    <!-- EDIT MODAL -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h2>✏️ Редактировать блюдо</h2>

            <div class="form-row">
                <div class="form-group">
                    <label>Название блюда *</label>
                    <input type="text" id="editTitle" placeholder="Название...">
                </div>
                <div class="form-group">
                    <label>Цена (₽) *</label>
                    <input type="number" id="editPrice" placeholder="0" min="0">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Категория *</label>
                    <select id="editCategory">
                        <option value="">Выберите категорию</option>
                        <option value="Закуски">Закуски</option>
                        <option value="Супы">Супы</option>
                        <option value="Салаты">Салаты</option>
                        <option value="Гарниры">Гарниры</option>
                        <option value="Горячие блюда">Горячие блюда</option>
                        <option value="Десерты">Десерты</option>
                    </select>
                </div>
            </div>

            <div class="form-row full">
                <div class="form-group">
                    <label>Описание *</label>
                    <textarea id="editDesc" placeholder="Описание..." rows="3" style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-family: 'Inter', sans-serif; color: var(--text-primary);"></textarea>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Фото (опционально)</label>
                    <div class="image-input-wrapper">
                        <div class="image-input-btn">📷 Выбрать новое фото</div>
                        <input type="file" id="editFileInput" accept="image/*">
                    </div>
                    <img id="editPreviewImage" class="image-preview">
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-success" id="saveEditBtn">Сохранить</button>
                <button class="btn btn-secondary" onclick="closeEditModal()">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        // ===== КОНФИГУРАЦИЯ =====
        const SUPABASE_URL = 'https://temrphpbgqwodcvgagrz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlbXJwaHBiZ3F3b2RjdmdhZ3J6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0OTEyMDcsImV4cCI6MjA5NDA2NzIwN30.NoZmurpCp0owULMwEhEHwVdkX5ddSgYCkXATCkHBuJg';
        const ADMIN_PASSWORD = 'admin123';

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let selectedImageBase64 = null;
        let editingProductId = null;
        let editImageBase64 = null;
        let products = [];

        // ===== DOM ЭЛЕМЕНТЫ =====
        const loginContainer = document.getElementById('loginContainer');
        const adminPanel = document.getElementById('adminPanel');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const messageContainer = document.getElementById('messageContainer');
        const productList = document.getElementById('productList');
        const fileInput = document.getElementById('fileInput');
        const previewImage = document.getElementById('previewImage');
        const addProductBtn = document.getElementById('addProductBtn');
        const clearFormBtn = document.getElementById('clearFormBtn');
        const editFileInput = document.getElementById('editFileInput');
        const editPreviewImage = document.getElementById('editPreviewImage');

        // ===== ФУНКЦИИ =====
        function showMessage(text, type) {
            const msg = document.createElement('div');
            msg.className = `message ${type} show`;
            msg.textContent = text;
            messageContainer.innerHTML = '';
            messageContainer.appendChild(msg);
            setTimeout(() => msg.remove(), 4000);
        }

        // ПРОВЕРКА ЛОГИНА ПРИ ЗАГРУЗКЕ
        if (localStorage.getItem('adminLoggedIn') === 'true') {
            loginContainer.classList.add('hidden');
            adminPanel.style.display = 'block';
            loadProducts();
        }

        // ===== ЛОГИН =====
        loginBtn.addEventListener('click', () => {
            if (passwordInput.value === ADMIN_PASSWORD) {
                localStorage.setItem('adminLoggedIn', 'true');
                loginContainer.classList.add('hidden');
                adminPanel.style.display = 'block';
                passwordInput.value = '';
                loadProducts();
            } else {
                showMessage('❌ Неверный пароль!', 'error');
            }
        });

        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('adminLoggedIn');
            loginContainer.classList.remove('hidden');
            adminPanel.style.display = 'none';
            passwordInput.value = '';
        });

        // ===== ЗАГРУЗКА ФОТО =====
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    selectedImageBase64 = event.target.result;
                    previewImage.src = selectedImageBase64;
                    previewImage.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        editFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    editImageBase64 = event.target.result;
                    editPreviewImage.src = editImageBase64;
                    editPreviewImage.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // ===== ЗАГРУЗКА ТОВАРОВ ИЗ БД =====
        async function loadProducts() {
            try {
                productList.innerHTML = '<div class="loading"><div class="spinner"></div><p>Загрузка блюд...</p></div>';
                
                // ОПТИМИЗИРОВАННЫЙ ЗАПРОС - без сложных операций
                const { data, error } = await supabase
                    .from('products')
                    .select('id, title, price, description, category, image')
                    .order('id', { ascending: false });

                if (error) {
                    console.error('Ошибка загрузки:', error);
                    throw error;
                }

                products = data || [];
                renderProductList();
            } catch (error) {
                console.error('Ошибка:', error);
                showMessage('❌ Ошибка загрузки блюд: ' + (error.message || 'Timeout'), 'error');
                productList.innerHTML = '<div class="loading"><p>⚠️ Ошибка при загрузке. Попробуйте перезагрузить страницу.</p></div>';
            }
        }

        // ===== ОТОБРАЖЕНИЕ ТОВАРОВ =====
        function renderProductList() {
            if (products.length === 0) {
                productList.innerHTML = '<div class="loading"><p>Нет добавленных блюд</p></div>';
                return;
            }

            productList.innerHTML = products.map(product => `
                <div class="product-card">
                    <img src="${product.image || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22%3E%3Crect fill=%22%23F1F5F9%22 width=%22200%22 height=%22200%22/%3E%3C/svg%3E'}" alt="${product.title}" class="product-image" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22%3E%3Crect fill=%22%23F1F5F9%22 width=%22200%22 height=%22200%22/%3E%3C/svg%3E'">
                    <div class="product-info">
                        <div class="product-category">${product.category || 'Прочее'}</div>
                        <h3>${product.title}</h3>
                        <p>${product.description}</p>
                        <div class="product-price">${product.price} ₽</div>
                        <div class="product-actions">
                            <button class="btn btn-small btn-success" onclick="openEditModal(${product.id})">✏️ Редактировать</button>
                            <button class="btn btn-small btn-danger" onclick="deleteProduct(${product.id})">🗑️ Удалить</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ===== ДОБАВЛЕНИЕ ТОВАРА =====
        clearFormBtn.addEventListener('click', () => {
            document.getElementById('productTitle').value = '';
            document.getElementById('productPrice').value = '';
            document.getElementById('productDesc').value = '';
            document.getElementById('productCategory').value = '';
            fileInput.value = '';
            previewImage.style.display = 'none';
            selectedImageBase64 = null;
            editingProductId = null;
        });

        addProductBtn.addEventListener('click', async () => {
            const title = document.getElementById('productTitle').value.trim();
            const price = parseInt(document.getElementById('productPrice').value);
            const description = document.getElementById('productDesc').value.trim();
            const category = document.getElementById('productCategory').value.trim();
            const file = fileInput.files[0];

            if (!title || !price || !description || !category || !file) {
                showMessage('❌ Заполните все поля и выберите фото!', 'error');
                return;
            }

            addProductBtn.disabled = true;
            addProductBtn.textContent = 'Загрузка...';

            try {
                // 1. Создаём товар без фото
                const { data: product, error: insertError } = await supabase
                    .from('products')
                    .insert([{
                        title,
                        price,
                        description,
                        category,
                        image: ''
                    }])
                    .select()
                    .single();

                if (insertError) throw insertError;

                // 2. Загружаем фото
                const fileName = `${product.id}_${Date.now()}.jpg`;
                const { error: uploadError } = await supabase.storage
                    .from('product-images')
                    .upload(fileName, file);

                if (uploadError) throw uploadError;

                // 3. Получаем публичную ссылку
                const { data: { publicUrl } } = supabase.storage
                    .from('product-images')
                    .getPublicUrl(fileName);

                // 4. Обновляем товар со ссылкой на фото
                const { error: updateError } = await supabase
                    .from('products')
                    .update({ image: publicUrl })
                    .eq('id', product.id);

                if (updateError) throw updateError;

                showMessage('✅ Блюдо успешно добавлено!', 'success');
                clearFormBtn.click();
                await loadProducts();
            } catch (error) {
                console.error('Ошибка:', error);
                showMessage('❌ Ошибка добавления: ' + error.message, 'error');
            } finally {
                addProductBtn.disabled = false;
                addProductBtn.textContent = '✅ Добавить блюдо';
            }
        });

        // ===== УДАЛЕНИЕ ТОВАРА =====
        async function deleteProduct(id) {
            if (!confirm('Вы уверены? Это действие нельзя отменить!')) return;

            try {
                const { error } = await supabase
                    .from('products')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                showMessage('✅ Блюдо удалено!', 'success');
                await loadProducts();
            } catch (error) {
                console.error('Ошибка:', error);
                showMessage('❌ Ошибка удаления!', 'error');
            }
        }

        // ===== РЕДАКТИРОВАНИЕ ТОВАРА =====
        function openEditModal(productId) {
            editingProductId = productId;
            const product = products.find(p => p.id === productId);
            
            if (product) {
                document.getElementById('editTitle').value = product.title || '';
                document.getElementById('editPrice').value = product.price || '';
                document.getElementById('editDesc').value = product.description || '';
                document.getElementById('editCategory').value = product.category || '';
                editPreviewImage.src = product.image || '';
                editPreviewImage.style.display = product.image ? 'block' : 'none';
                editImageBase64 = null;
                editFileInput.value = '';
                
                document.getElementById('editModal').classList.add('active');
            }
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            editingProductId = null;
            editImageBase64 = null;
        }

        // ===== СОХРАНЕНИЕ РЕДАКТИРОВАНИЯ =====
        document.getElementById('saveEditBtn').addEventListener('click', async () => {
            if (!editingProductId) {
                showMessage('❌ Ошибка: товар не выбран', 'error');
                return;
            }

            const title = document.getElementById('editTitle').value.trim();
            const priceStr = document.getElementById('editPrice').value;
            const description = document.getElementById('editDesc').value.trim();
            const category = document.getElementById('editCategory').value.trim();
            const newFile = editFileInput.files[0];

            if (!title || !priceStr || !description || !category) {
                showMessage('❌ Заполните все обязательные поля!', 'error');
                return;
            }

            const price = parseInt(priceStr);
            if (isNaN(price)) {
                showMessage('❌ Цена должна быть числом!', 'error');
                return;
            }

            const saveBtn = document.getElementById('saveEditBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'Сохранение...';

            try {
                let updateData = {
                    title: title,
                    price: price,
                    description: description,
                    category: category
                };

                // Если выбрали новое фото
                if (newFile) {
                    const fileName = `${editingProductId}_${Date.now()}.jpg`;
                    
                    // Загружаем новое фото
                    const { error: uploadError } = await supabase.storage
                        .from('product-images')
                        .upload(fileName, newFile);
                    
                    if (uploadError) throw uploadError;
                    
                    // Получаем публичную ссылку
                    const { data: { publicUrl } } = supabase.storage
                        .from('product-images')
                        .getPublicUrl(fileName);
                    
                    updateData.image = publicUrl;
                }

                const { error } = await supabase
                    .from('products')
                    .update(updateData)
                    .eq('id', editingProductId);

                if (error) throw error;

                showMessage('✅ Блюдо успешно обновлено!', 'success');
                editingProductId = null;
                document.getElementById('editModal').classList.remove('active');
                await loadProducts();
            } catch (error) {
                console.error('Ошибка при сохранении:', error);
                showMessage('❌ Ошибка: ' + (error.message || 'Неизвестная ошибка'), 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Сохранить';
            }
        });

        // ===== ЭКСПОРТ ФУНКЦИЙ В ГЛОБАЛЬНУЮ ОБЛАСТЬ =====
        window.deleteProduct = deleteProduct;
        window.openEditModal = openEditModal;
        window.closeEditModal = closeEditModal;
    </script>
</body>
</html>
