<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ Панель — Taste & Serve</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4"></script>
    <style>
        :root {
            --accent: #f97316;
            --accent-dark: #ea580c;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --border: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .login-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .login-container.hidden {
            display: none;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            max-width: 400px;
            width: 90%;
        }

        .login-box h1 {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .login-box p {
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
        }

        .btn:hover {
            background: var(--accent-dark);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            background: white;
            padding: 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }

        .admin-header h1 {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .logout-btn {
            padding: 10px 20px;
            background: #fee2e2;
            color: #dc2626;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }

        .logout-btn:hover {
            background: #fecaca;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            margin-bottom: 30px;
        }

        .section h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .image-input-wrapper {
            position: relative;
            overflow: hidden;
        }

        .image-input-btn {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 2px dashed var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            color: var(--text-secondary);
            transition: var(--transition);
            text-align: center;
        }

        .image-input-btn:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
            color: var(--accent);
        }

        #fileInput {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .image-preview {
            width: 150px;
            height: 150px;
            border-radius: var(--radius-md);
            object-fit: cover;
            margin-top: 12px;
            border: 2px solid var(--border);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-group .btn {
            flex: 1;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }

        .product-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: var(--transition);
        }

        .product-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .product-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: linear-gradient(135deg, #fed7aa, #f1f5f9);
        }

        .product-info {
            padding: 16px;
        }

        .product-info h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .product-info p {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .product-price {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .product-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            flex: 1;
            padding: 8px;
            font-size: 12px;
        }

        .btn-danger {
            background: #fee2e2;
            color: #dc2626;
        }

        .btn-danger:hover {
            background: #fecaca;
        }

        .message {
            padding: 16px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .spinner {
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .admin-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <h1>Админ Панель</h1>
            <p>Введите пароль для доступа</p>
            
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="passwordInput" placeholder="Введите пароль" autocomplete="off">
            </div>

            <button class="btn" id="loginBtn">Войти</button>
        </div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="adminPanel" style="display: none;">
        <div class="admin-header">
            <h1>🍽️ Администрирование Меню</h1>
            <button class="logout-btn" id="logoutBtn">Выход</button>
        </div>

        <div class="admin-container">
            <div id="message"></div>

            <!-- Add Product Section -->
            <div class="section">
                <h2>➕ Добавить новое блюдо</h2>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Название блюда *</label>
                        <input type="text" id="productTitle" placeholder="Сэндвич с тунцом">
                    </div>
                    <div class="form-group">
                        <label>Цена (₽) *</label>
                        <input type="number" id="productPrice" placeholder="350" min="0">
                    </div>
                </div>

                <div class="form-row full">
                    <div class="form-group">
                        <label>Описание *</label>
                        <textarea id="productDesc" placeholder="Хлеб тостовый, салат, томат, огурец, тунец..." rows="3" style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-family: 'Inter', sans-serif; color: var(--text-primary);"></textarea>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Фото блюда *</label>
                        <div class="image-input-wrapper">
                            <div class="image-input-btn">📷 Выбрать фото</div>
                            <input type="file" id="fileInput" accept="image/*">
                        </div>
                        <img id="previewImage" class="image-preview" style="display: none;">
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn" id="addProductBtn">Добавить блюдо</button>
                    <button class="btn btn-secondary" id="clearFormBtn">Очистить</button>
                </div>
            </div>

            <!-- Products List Section -->
            <div class="section">
                <h2>📋 Все блюда</h2>
                <div id="productsList" class="products-grid">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Загрузка блюд...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://temrphpbgqwodcvgagrz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlbXJwaHBiZ3F3b2RjdmdhZ3J6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0OTEyMDcsImV4cCI6MjA5NDA2NzIwN30.NoZmurpCp0owULMwEhEHwVdkX5ddSgYCkXATCkHBuJg';
        const ADMIN_PASSWORD = 'admin123'; // Измените на свой пароль!

        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let selectedImageBase64 = null;
        let products = [];

        // LOGIN
        const loginContainer = document.getElementById('loginContainer');
        const adminPanel = document.getElementById('adminPanel');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        if (localStorage.getItem('adminLoggedIn') === 'true') {
            loginContainer.classList.add('hidden');
            adminPanel.style.display = 'block';
            loadProducts();
        }

        loginBtn.addEventListener('click', () => {
            if (passwordInput.value === ADMIN_PASSWORD) {
                localStorage.setItem('adminLoggedIn', 'true');
                loginContainer.classList.add('hidden');
                adminPanel.style.display = 'block';
                passwordInput.value = '';
                loadProducts();
            } else {
                alert('❌ Неверный пароль!');
            }
        });

        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('adminLoggedIn');
            loginContainer.classList.remove('hidden');
            adminPanel.style.display = 'none';
            passwordInput.value = '';
        });

        // IMAGE UPLOAD
        const fileInput = document.getElementById('fileInput');
        const previewImage = document.getElementById('previewImage');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    selectedImageBase64 = event.target.result;
                    previewImage.src = selectedImageBase64;
                    previewImage.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // MESSAGE DISPLAY
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.className = `message show ${type}`;
            messageEl.textContent = text;
            setTimeout(() => {
                messageEl.classList.remove('show');
            }, 3000);
        }

        // LOAD PRODUCTS
        async function loadProducts() {
            try {
                const { data, error } = await supabase
                    .from('products')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                products = data || [];
                renderProducts();
            } catch (error) {
                console.error('Ошибка:', error);
                showMessage('Ошибка загрузки блюд', 'error');
            }
        }

        function renderProducts() {
            const listEl = document.getElementById('productsList');
            if (products.length === 0) {
                listEl.innerHTML = '<div class="loading"><p>Нет добавленных блюд</p></div>';
                return;
            }

            listEl.innerHTML = products.map(product => `
                <div class="product-card">
                    <img src="${product.image}" alt="${product.title}" class="product-image" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22%3E%3Crect fill=%22%23F1F5F9%22 width=%22200%22 height=%22200%22/%3E%3C/svg%3E'">
                    <div class="product-info">
                        <h3>${product.title}</h3>
                        <p>${product.description}</p>
                        <div class="product-price">${product.price} ₽</div>
                        <div class="product-actions">
                            <button class="btn btn-small btn-danger" onclick="deleteProduct(${product.id})">🗑️ Удалить</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ADD PRODUCT
        const addProductBtn = document.getElementById('addProductBtn');
        const clearFormBtn = document.getElementById('clearFormBtn');

        clearFormBtn.addEventListener('click', () => {
            document.getElementById('productTitle').value = '';
            document.getElementById('productPrice').value = '';
            document.getElementById('productDesc').value = '';
            fileInput.value = '';
            previewImage.style.display = 'none';
            selectedImageBase64 = null;
        });

        addProductBtn.addEventListener('click', async () => {
            const title = document.getElementById('productTitle').value.trim();
            const price = parseInt(document.getElementById('productPrice').value);
            const description = document.getElementById('productDesc').value.trim();

            if (!title || !price || !description || !selectedImageBase64) {
                showMessage('❌ Заполните все поля и выберите фото!', 'error');
                return;
            }

            addProductBtn.disabled = true;
            addProductBtn.textContent = 'Загрузка...';

            try {
                const { data, error } = await supabase
                    .from('products')
                    .insert([{
                        title,
                        price,
                        description,
                        image: selectedImageBase64
                    }])
                    .select();

                if (error) throw error;

                showMessage('✅ Блюдо успешно добавлено!', 'success');
                clearFormBtn.click();
                await loadProducts();
            } catch (error) {
                console.error('Ошибка:', error);
                showMessage('❌ Ошибка добавления: ' + error.message, 'error');
            } finally {
                addProductBtn.disabled = false;
                addProductBtn.textContent = 'Добавить блюдо';
            }
        });

        // DELETE PRODUCT
        async function deleteProduct(id) {
            if (!confirm('Вы уверены? Это действие нельзя отменить!')) return;

            try {
                const { error } = await supabase
                    .from('products')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                showMessage('✅ Блюдо удалено!', 'success');
                await loadProducts();
            } catch (error) {
                console.error('Ошибка:', error);
                showMessage('❌ Ошибка удаления!', 'error');
            }
        }

        window.deleteProduct = deleteProduct;
    </script>
</body>
</html>
